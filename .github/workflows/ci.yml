# Every pull request. No credentials, no AWS account, no network beyond installing dependencies.
#
# That is not a limitation to apologise for — it is the design. Every claim this repository
# makes is checked here, on a runner with nothing, which is the same thing as saying a reviewer
# can check them on a laptop.
#
# CI exists from the first commit. A suite added to a finished project is a suite shaped to
# pass the project.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Deploy re-runs this whole file against the exact ref being deployed. Without
  # `workflow_call`, a `uses: ./.github/workflows/ci.yml` is not a reusable workflow at all and
  # the deploy fails before its first step — which is how a repository ends up with a deploy
  # path nobody has ever successfully started.
  workflow_call:
    inputs:
      run_corpus:
        description: >-
          Regenerate the 3,000-document corpus inside the reader image and compare it against
          the committed ground truth. Default true, and it stays true for every push.

          `deploy.yml` passes false, under a dated acceptance in `contracts/ci/acceptance.yaml`
          that `check_deploy_path.py` refuses to let expire. The reasoning is in that file and
          the short version is: this job proves a property of the *repository* — that the
          generator is deterministic — and nothing the deploy applies depends on regenerating
          the corpus, because every threshold comes from the committed recording. It is 24 of
          the gate's 36 minutes against 3 minutes of actual applying, re-run on every attempt to
          fix a one-line grant, having already passed on the same commit.
        # **A string, not a boolean, and that is not a style choice.**
        #
        # GitHub's expression `==` coerces loosely: `null` and `false` both become `0`, so
        # `inputs.run_corpus == null` — the obvious way to write "run it when nobody said
        # otherwise" — is *true* when somebody said `false`. The job ran for 24 minutes in the
        # run that was supposed to skip it, and the condition looked correct in the diff.
        #
        # Compared against the string `'false'` there is nothing to coerce: a push supplies no
        # input and `'' != 'false'` runs the job; the deploy supplies `'false'` and it does not.
        type: string
        required: false
        default: "true"

# **Every third-party action is pinned to a commit SHA, never to a tag.**
#
# A tag moves. `actions/checkout@v4` is whatever the maintainer last pointed v4 at, and an
# account compromise upstream becomes code running here — in a workflow that, in `deploy.yml`,
# holds `id-token: write` and can assume a role that builds the whole estate. That is the
# shortest path from somebody else's stolen credentials to this AWS account, and it does not
# involve this repository being wrong about anything.
#
# The trailing comment keeps the human-readable version beside the digest, because a wall of
# hex is a wall nobody reviews. `scripts/check_deploy_path.py` refuses a `uses:` without a SHA.
permissions:
  contents: read

concurrency:
  # **`github.workflow` is in the key because this workflow has two callers, and one of them
  # applies infrastructure.**
  #
  # `deploy.yml` runs this as its gate with `uses:`. A reusable workflow's concurrency group is
  # evaluated against the *caller's* context, so both a push to `main` and a deploy dispatched
  # from `main` resolved to `ci-refs/heads/main` — and with `cancel-in-progress: true`, pushing
  # anything cancelled the gate of a deploy already in flight.
  #
  # That is not a slow deploy, it is the property `deploy.yml` declares `cancel-in-progress:
  # false` to protect: *"a cancelled apply leaves state that describes half an estate, and the
  # next plan wants to destroy things nobody created"*. The intent was written on the deploy and
  # defeated one level down, by a group key that could not tell the two runs apart.
  #
  # In a called workflow `github.workflow` is the caller's name, so a push is `ci-CI-...` and a
  # deploy's gate is `ci-deploy-...`. Two pushes still cancel each other, which is the behaviour
  # this was for.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts corpus evals pipelines
      - run: ruff format --check src tests scripts corpus evals pipelines
      # No engine binary, no corpus render, no network. Under a second, which is what makes it
      # a thing people run rather than a thing people wait for.
      - run: pytest -q

  claims:
    name: the claim gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"

      - name: the core imports no cloud SDK, reads no clock, and names no engine
        # The precondition for every other claim. The day a boto3 import, a `datetime.now()` or
        # a branch on an engine name appears three levels down, nothing fails — the suite just
        # stops being runnable by a stranger, and that was the whole of the evidence.
        run: python scripts/check_core_is_pure.py

      - name: the documented tree exists, and every core module has a caller that runs
        # `check_core_is_pure.py` says nothing cloud gets *into* the core. This says nothing pure
        # is left *orphaned* in it — a decision this repository proved and does not make, which
        # is what `feedback`, `drift` and `lineitems` were until they were given callers, and
        # what `reconciliation`, `review` and `entities` were while claims 4, 5 and 6 were scored
        # against a system that had no path to any of them.
        run: python scripts/check_the_map_matches_the_ground.py

      - name: every claim harness on disk is run by this workflow
        # The check that would have caught the largest gap this project has had. Three
        # hand-maintained lists of what proves this repository — `make claims`, the job below,
        # and `preflight` — and nothing compared them to the directory. Six harnesses ran
        # nowhere automatic, one of them `provenance`.
        run: python scripts/check_every_gate_runs.py

      - name: the contract set loads and cross-checks
        run: python scripts/check_contracts.py

      - name: the image's reader and the recording's reader are the same reader
        # The check that would have caught the worst finding of the first deploy, offline, in
        # two seconds. The recording was made by Homebrew's tesseract 5.5.2; the image is
        # Debian, which carries 5.5.0; the image asserted only the *series* and let it through.
        # The deploy went green and the first real document failed on `s3:ListBucket` — because
        # the handler asks for its thresholds by the reader's exact identity, and nothing had
        # shipped an artefact for the reader that was actually reading.
        run: python scripts/reader_version_check.py

      - name: a document that publishes some of itself still owes the rest to a human
        # Doctrine rule 1 asserted against the deployed state machine rather than against the
        # core. The estate shipped with Publish and QueueForReview as the only terminal states,
        # mutually exclusive — so a document that published eight fields and abstained on four
        # sent the four to nobody, silently, on every successful execution.
        run: python scripts/check_pipeline_routing.py

      - name: the corpus plants mismatches blind to the rules that will find them
        # Claim 4's independence, read off the import graph. A planter that knows the
        # reconciliation contract is a planter that can be tuned to it, and the harness would
        # keep reporting green afterwards.
        run: python scripts/check_planting_is_blind.py

      - name: "claim 1 — no field publishes below a derived threshold"
        # Derived from the committed recording, never from a live reader run: the binary's
        # confidences differ across versions, and a threshold that moved because a runner image
        # changed would make this check the first thing somebody deletes. See ADR-0005.
        run: python -m evals.calibration

      - name: "claim 1, as a loop — what review evidence does to a threshold"
        # The arrow that must not exist: corrections move N, never an error budget.
        run: python -m evals.feedback

      - name: "the declared envelope, applied to arriving traffic"
        # Fires in both directions. A reader that has become suddenly confident has usually
        # stopped seeing something.
        run: python -m evals.drift

      - name: "a classification must point at the text it came from"
        run: python -m evals.grounding

      - name: "what the derived policy buys against the alternatives"
        run: python -m evals.baseline

      - name: "out of distribution — does 0.9 mean the same on paper nobody here designed"
        # The answer to *did you tune the generator until the claims passed?*, and it ran
        # nowhere. It needs no external corpus at runtime: `recordings/external/` is committed,
        # the same way `recordings/ocr/` is, so this is a comparison of two committed curves.
        run: python -m evals.external

      - name: "claim 3 — re-extraction is reproducible and versioned"
        run: python -m evals.reprocessing

      - name: "claim 4 — cross-document disagreement is surfaced"
        # Two numbers: the reconciliation logic on the values that were printed, which must be
        # exactly right, and the system end to end on the values the reader extracted, which is
        # worse and is the honest one. Reporting only the first would be the overclaim.
        run: python -m evals.reconciliation

      - name: "claim 5 — the human loop is real, and measured"
        # Both halves. The capacity gate fires on the current configuration and passes only on
        # a named, dated, expiring acceptance — doctrine rule 6. When that acceptance lapses,
        # this step goes red on its own, which is the whole point of an expiry.
        run: python -m evals.review

      - name: "claim 6 — entity resolution is reversible"
        run: python -m evals.entities

      - name: "claim 7 — bulk reprocessing is idempotent, and its cost is modelled"
        run: python -m evals.scale

      - name: indirect prompt injection on document text
        # Not one of the seven: this control already exists in Attestor and is implemented here
        # properly rather than presented as a discovery. What is scored is that it works on
        # this corpus — and the false-positive number is the one that decides whether it
        # survives contact with a real document set.
        run: python -m evals.injection

      - name: the line-total check catches a truncated table
        run: python -m evals.lineitems

      - name: the classification gate abstains on a contested heading
        run: python -m evals.classification

      - name: every analytics mart reads columns the warehouse declares
        run: python scripts/check_marts.py

      - name: every warehouse column has a source, or is declared to have none
        # `check_marts` proves the marts read only declared columns. This asks the next
        # question — whether any of those columns has anything that writes it — and the answer
        # today is that six of fifty-five do. The lakehouse and the warehouse both applied
        # cleanly on 2026-08-11 and neither has ever held a row.
        run: python scripts/check_warehouse_is_fed.py

      # Claim 2 is the only one absent, and for a reason rather than an omission: it needs the
      # rendered corpus, which is git-ignored and reproducible from a seed. It runs in
      # `make preflight` on a machine that has generated it.

  corpus:
    name: the generator reproduces the committed ground truth
    # Anything but the literal string `false` runs it, including the empty value a push gives.
    if: ${{ inputs.run_corpus != 'false' }}
    runs-on: ubuntu-latest
    # One generation of three thousand documents with their pages, plus claim 2 rasterising
    # a sample of them. Ninety rather than sixty because the previous arrangement hit sixty
    # exactly, and a timeout is a failure that reads like a flake.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # **Inside the image, and that is the whole point of the job.**
      #
      # Box geometry comes from font metrics, and `corpus/sheet.py` accepts exactly one font —
      # the one in this image. A check run on the bare runner would use whatever font the runner
      # has and could never agree with a ground truth generated in the image, so it would be a
      # step that can only ever be red.
      #
      # It is a job of its own rather than a step in `claims` because it takes twenty minutes and
      # nothing else waits on it. It exists at all because for the life of this project the check
      # ran nowhere: it was in `make claims`, in no workflow, and where the ceremony did run it,
      # it ran immediately after `corpus.generate` — comparing the corpus that command had just
      # written against itself.
      - name: build the image the corpus is generated in
        run: docker build --tag manifest-reader:ci .

      - name: generate the corpus once, with its pages
        # **Once, not twice.** This job used to run `corpus.generate --check`, which regenerates
        # the ground truth from the seed with `write_images=False` and compares it — thirty
        # minutes on a runner, all of it layout arithmetic. Adding claim 2 then added a *second*
        # full generation to render the pages it rasterises, and the job hit its sixty-minute
        # timeout mid-render.
        #
        # A plain generate writes the ground truth *and* the images in one pass, and the
        # comparison it was doing is `git diff` against the committed file — which is a stronger
        # check than the one it replaced, because it compares the actual committed bytes rather
        # than a copy this job read back out of the working tree. `--check` itself warned about
        # that fallback in its own output.
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --env PYTHONPATH=/work/src \
            --entrypoint /usr/local/bin/python \
            manifest-reader:ci \
            -m corpus.generate

      - name: the ground truth reproduces byte for byte
        # Box geometry comes from font metrics, so a different font is a different ground truth.
        # A loud failure on purpose: the alternative is every claim being scored against boxes
        # that quietly moved.
        run: git diff --exit-code -- corpus/ground_truth/

      - name: "claim 2 — every published field traces to a page and a box"
        # **The project in one sentence, and it ran in no workflow.** `CLAUDE.md` calls it that:
        # *a published field that cannot be located on a page is a build failure*.
        #
        # It belongs **here** rather than in the claim-gates job, and putting it there first was
        # a mistake that CI caught in one run: `corpus/rendered does not exist`. The pages are
        # not in the repository — box geometry comes from font metrics, so they are generated in
        # the image, by the step directly above. This is the only job that has them.
        #
        # Which means claim 2 rides the same acceptance as the corpus check: every push to main
        # runs it, and the deploy gate skips it under `contracts/ci/acceptance.yaml`. That is
        # weaker than the other fourteen and it is stated rather than hidden — and it is
        # incomparably stronger than the previous arrangement, which was nowhere at all.
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --env PYTHONPATH=/work/src \
            --entrypoint /usr/local/bin/python \
            manifest-reader:ci \
            -m evals.provenance

  gate-proof:
    name: attack our own gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      # Copies the repository, plants a real violation, and requires the *named* gate to refuse
      # it for the right reason. A gate that has never been shown to fail is a comment.
      - run: python scripts/gate_proof.py

  infrastructure:
    name: terraform and checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.5
      - name: install what the checks import
        # `check_deploy_path.py` and `tf_validate.py` read YAML. This job installed checkov and
        # Terraform and nothing else, so the first check failed on `No module named 'yaml'` —
        # a job that had never been run, because until today nothing had ever dispatched a
        # deploy and CI's own runs did not reach it.
        run: pip install --quiet pyyaml
      - name: install checkov on its own
        # It pins boto3 exactly. A scanner is a tool; boto3 is the application. Keeping them in
        # separate environments is what stops the scanner deciding the application's dependency
        # floor.
        run: pipx install checkov
      - name: the deploy path tears itself down
        # Checked in CI rather than only in preflight, because the asymmetry it catches is
        # acquired in a pull request: somebody adds a layer to deploy.yml and the destroy file
        # is the one they do not have open.
        run: python scripts/check_deploy_path.py
      - name: every granted action sits where its resources could match it
        # The teardown of 2026-08-15 left thirty-three SageMaker lineage entities standing with
        # the four verbs needed to remove them present in the policy file — inside a statement
        # scoped to SQS queues and DynamoDB tables. Terraform validates the document's shape and
        # checkov asks whether it is too broad. Neither asks whether an action can fire at all.
        run: python scripts/check_policy_actions_can_match.py
      - run: terraform fmt -check -recursive infra
      - name: validate every layer against real provider schemas
        # `-backend=false`: no state, no credentials, nothing reached but the provider registry.
        # This catches an attribute that does not exist. It does not catch a value a provider
        # would reject — those validators run in the plan phase, and a plan needs credentials
        # this repository does not use.
        run: python scripts/tf_validate.py
      - name: checkov
        # Zero findings. Every deliberate exception carries an inline reason beside the resource
        # it applies to — a suppression file nobody reads is how a scanner stops meaning
        # anything.
        run: checkov -d infra --compact --quiet

  engine:
    name: the adapter still parses what the binary emits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # **Inside the image, and the old version of this job shows why.**
      #
      # It used to `apt-get install tesseract-ocr` on the runner and check the adapter against
      # whatever that gave — `tesseract 5.3.4`, as the log said the day this changed. The estate
      # runs 5.5.0. So a job whose whole purpose is "the adapter still understands the binary's
      # output" was reading a binary the system never runs, and would have gone on passing
      # through a format change in the one that matters.
      #
      # It also renders its own test page, which now needs the pinned corpus font — present in
      # the image and nowhere else.
      - name: build the image the reader actually is
        run: docker build --tag manifest-reader:ci .

      - name: read a page with that binary and check the adapter maps it
        # **This job does not recompute a single threshold, and that is the point.**
        #
        # Deriving one here would move it whenever the image is rebuilt, claim 1 would go red for
        # reasons that have nothing to do with this repository, and the check would be switched
        # off within a month. Thresholds come from the committed recording, under the ceremony in
        # `.github/workflows/record.yml`.
        #
        # What this checks is a *different* failure and one that must stay distinguishable: that
        # the adapter still understands the binary's output format. A version bump that changed
        # the TSV columns would break every reading silently, and no amount of committed
        # recording would notice. See `docs/DECISIONS.md` 19.
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --env PYTHONPATH=/work/src \
            --entrypoint /usr/local/bin/python \
            manifest-reader:ci \
            scripts/check_engine_adapter.py

  image:
    name: the reader image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: build it
        # Built on every pull request, pushed by nothing. A Dockerfile is code, and a broken one
        # discovered by the deploy is discovered after the environment approval has been given —
        # the same class of failure as a missing IAM grant, and just as avoidable.
        #
        # The build itself asserts the reader version and every language pack, so this job also
        # catches a base image whose publisher moved the binary underneath it. That would move
        # every derived threshold in this repository on the next deploy, silently.
        run: docker build -t manifest-reader:ci .
