          # cannot see it, because reading nothing is a successful read. Left unchecked this
          # job would carry on, set no variables, and stop at an input prompt with no terminal
          # to appear on: the same failure the required-variable gate was written to close,
          # arriving through a different door.
          if [ "$resolved" -eq 0 ]; then
            echo "::error::nothing published under /${{ env.PROJECT }}/foundation/ — apply the foundation layer first"
            exit 1
          fi
          echo "resolved $resolved reference(s) from /${{ env.PROJECT }}/foundation/*"
      - name: resolve what lakehouse published
        # **The layer order was reversed for this step.** `extraction` used to apply before
        # `lakehouse`, which was fine while nothing in it touched the lake — and the moment a
        # function had to write to the Iceberg table, the layer that creates that table came
        # afterwards. Nothing reads another layer's state here, so the order *is* the dependency
        # graph, and the graph changed when the pipeline gained a landing step.
        run: |
          set -euo pipefail
          resolved=0
          while read -r name value; do
            echo "TF_VAR_${name}=${value}" >> "$GITHUB_ENV"
            resolved=$((resolved + 1))
          done < <(
            aws ssm get-parameters-by-path \
              --path "/${{ env.PROJECT }}/lakehouse" \
              --query 'Parameters[].[Name,Value]' --output text \
              | sed "s|/${{ env.PROJECT }}/lakehouse/||"
          )
          if [ "$resolved" -eq 0 ]; then
            echo "::error::nothing published under /${{ env.PROJECT }}/lakehouse/ — apply the lakehouse layer first"
            exit 1
          fi
          echo "resolved $resolved reference(s) from /${{ env.PROJECT }}/lakehouse/*"
      - name: build and push the reader image
        # **The reader binary is the artefact.** Every confidence threshold in this repository
        # was derived from one build of it, so the functions are pinned to a *digest* rather
        # than a tag: a tag says what somebody meant, a digest says what is there. The image
        # itself refuses to build if the reader version or any language pack is not what the
        # recording ceremony expects — see the Dockerfile.
        id: image
        run: |
          set -euo pipefail
          # The repository URL comes from what foundation published, not from a string built
          # here. A constructed URL is a second place the name lives, and the two drift.
          repository="$TF_VAR_reader_repository_url"
          registry="${repository%%/*}"
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "$registry"
          # Tagged by commit, never `latest`. The repository is IMMUTABLE, so a tag cannot be
          # moved onto a different build after the fact.
          docker build -t "$repository:${{ github.sha }}" .
          docker push "$repository:${{ github.sha }}"
          digest=$(aws ecr describe-images \
            --repository-name "${{ env.PROJECT }}-reader" \
            --image-ids imageTag=${{ github.sha }} \
            --query 'imageDetails[0].imageDigest' --output text)
          if [ -z "$digest" ] || [ "$digest" = "None" ]; then
            echo "::error::the image pushed but no digest came back; refusing to deploy a function pinned to nothing"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: the document-automation project tier 2 reads through
        # **Not Terraform, and the reason is in `infra/extraction/variables.tf`:** the AWS
        # provider has no resource for a Bedrock Data Automation project and neither does
        # CloudFormation. `scripts/bda_project.py` is idempotent by name and holds the whole
        # configuration in one screen; `destroy.yml` deletes it.
        #
        # The profile is assembled rather than looked up: the ARN is
        # `data-automation-profile/<region-prefix>.data-automation-v1`, and the prefix is the
        # only part that varies.
        if: ${{ inputs.enable_escalation_tiers }}
        run: |
          set -euo pipefail
          # `--upgrade`, because the runner ships a boto3 old enough not to know
          # `bedrock-data-automation` exists at all: *"Unknown service"*, with a list of two
          # hundred valid names that does not include it. Installing without it is a no-op
          # against the preinstalled version, which is the shape that looks like a dependency
          # being handled.
          python3 -m pip install --quiet --upgrade boto3
          BDA_PROJECT_ARN=$(python3 scripts/bda_project.py --print-arn | tail -1)
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          PREFIX=${AWS_REGION%%-*}
          # Assigned as shell variables first and exported second, rather than composed inside
          # the `echo`. `check_deploy_path` requires a real assignment for anything reaching
          # `-var`, and it is right to: `echo "VAR=$VAR" >> $GITHUB_ENV` on an unset variable
          # writes `VAR=` and defines it as empty for every later step, which is the shape that
          # once sent `[""]` to a policy.
          BDA_PROFILE_ARN="arn:aws:bedrock:${AWS_REGION}:${ACCOUNT}:data-automation-profile/${PREFIX}.data-automation-v1"
          # **The profile is cross-region, so the grant has to be too.** `eu.data-automation-v1`
          # routes a page to whichever EU region has capacity, and IAM authorises against the
          # profile ARN *in the region it lands in* — the first real tier-2 call was refused on
          # `eu-north-1` while the policy named `eu-central-1`. Identical to what the escalation
          # models already needed, and found the same way.
          #
          # The regions come from the inference profile this account resolved a moment ago rather
          # than from a list typed here: one source, and `docs/REGULATORY.md`'s statement that
          # document text is processed in the EU stays true by construction instead of by a
          # comment. A wildcard would be shorter and would give up exactly that sentence.
          BDA_ARNS=$(python3 scripts/bda_project.py --print-grant-arns "$ESCALATION_MODEL_ARNS")
          {
            echo "BDA_PROJECT_ARN=$BDA_PROJECT_ARN"
            echo "BDA_PROFILE_ARN=$BDA_PROFILE_ARN"
            echo "BDA_ARNS=$BDA_ARNS"
          } >> "$GITHUB_ENV"
          echo "tier 2 reads through $BDA_PROJECT_ARN"
      - name: package the extraction handler
        # Code and contracts from the same commit, in one artefact. A deployment where they came
        # from different revisions would apply one version's comparison rules to another
        # version's fields, and nothing anywhere would report it.
        id: package
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          python -m pip install --quiet --target "$staging" ".[handlers]"
          cp -r contracts "$staging/contracts"
          (cd "$staging" && zip -qr "$GITHUB_WORKSPACE/publish.zip" .)
          key="artifacts/publish-${{ github.sha }}.zip"
          aws s3api put-object \
            --bucket "$TF_VAR_records_bucket" \
            --key "$key" \
            --body "$GITHUB_WORKSPACE/publish.zip" \
            --server-side-encryption aws:kms \
            --ssekms-key-id "$TF_VAR_data_key_arn" >/dev/null
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "hash=$(openssl dgst -sha256 -binary "$GITHUB_WORKSPACE/publish.zip" | base64)" >> "$GITHUB_OUTPUT"
      - name: upload the derived thresholds
        # **The artefact the extraction handler reads, and that nothing created.** Without this
        # the first invocation after a deploy fails on `NoSuchKey` — the same family as the
        # provenance gate that was invoked by a name no layer created, and just as invisible:
        # every offline check reads `recordings/thresholds.json` directly, so every offline
        # check passed.
        #
        # Rendered from the committed recording rather than recomputed here. Recomputing would
        # let a threshold move because a runner image was updated, in the one place where it
        # decides whether a value reaches a customer.
        run: |
          set -euo pipefail
          python scripts/thresholds_artefact.py --out thresholds.json
          key=$(python scripts/thresholds_artefact.py --print-key)
          aws s3api put-object \
            --bucket "$TF_VAR_records_bucket" \
            --key "$key" \
            --body thresholds.json \
            --content-type application/json \
            --server-side-encryption aws:kms \
            --ssekms-key-id "$TF_VAR_data_key_arn" >/dev/null
          echo "uploaded $key"
      - name: fit and upload the classification artefact
        # **The gate is the point of this step, not the upload.** `train_classifier.py` refuses to
        # write anything if the fitted model separates a contested pair by more than the band
        # `contracts/classification/headings.yaml` declares — so a deploy carrying a model that
        # is confident where the trade is not fails here, before the endpoint exists, rather than
        # answering confidently in production.
        #
        # It also refuses if the exported artefact disagrees with scikit-learn by more than 1e-9.
        # The artefact is JSON rather than a pickle for three reasons written in
        # `classification/artefact.py`; that check is the price, and it is paid here.
        if: ${{ inputs.enable_classifier }}
        id: classifier
        run: |
          set -euo pipefail
          python -m pip install --quiet ".[classifier]"
          key="models/hs-classifier-${{ github.sha }}/model.tar.gz"
          python scripts/train_classifier.py --out build
          aws s3api put-object \
            --bucket "$TF_VAR_records_bucket" \
            --key "$key" \
            --body build/model.tar.gz \
            --server-side-encryption aws:kms \
            --ssekms-key-id "$TF_VAR_data_key_arn" >/dev/null
          echo "model_data_url=s3://$TF_VAR_records_bucket/$key" >> "$GITHUB_OUTPUT"
          echo "uploaded $key"
      - name: apply
        run: |
          terraform -chdir=infra/extraction init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=${{ env.AWS_REGION }}"
          # **Both shapes plan before either applies.** An optional feature that breaks the
          # configuration it is absent from is one every ordinary deploy trips over, and
          # `terraform validate` cannot see it: both shapes are type-correct. This costs seconds
          # and it is the only check in this repository that needs credentials, which is why it
          # runs here rather than in the offline suite.
          python3 -m pip install --quiet pyyaml
          python3 scripts/check_optional_layers_plan.py
          terraform -chdir=infra/extraction plan -out=tfplan \
            -var 'expires_at=${{ inputs.expires_at }}' \
            -var "reader_image_digest=${{ steps.image.outputs.digest }}" \
            -var "publish_package_key=${{ steps.package.outputs.key }}" \
            -var "publish_package_hash=${{ steps.package.outputs.hash }}" \
            -var "escalation_model_arns=$ESCALATION_MODEL_ARNS" \
            -var "enable_escalation_tiers=${{ inputs.enable_escalation_tiers }}" \
            -var "bda_profile_arn=$BDA_PROFILE_ARN" \
            -var "bda_project_arn=$BDA_PROJECT_ARN" \
            -var "document_automation_arns=${BDA_ARNS:-[]}" \
            -var "enable_classifier=${{ inputs.enable_classifier }}" \
            -var "classifier_model_data_url=${{ steps.classifier.outputs.model_data_url }}" \
            -var "escalation_model_id=${ESCALATION_MODEL_ARN##*/}"
          terraform -chdir=infra/extraction show -json tfplan > infra/extraction/tfplan.json
          # A plan carrying deletions stops here unless the dispatch said so. Every
          # feature flag on this workflow defaults to `false`, so a dispatch that forgets
          # one asks to tear that feature down — and one did, silently, on 2026-08-14.
          python3 scripts/check_plan_destroys.py infra/extraction/tfplan.json --layer extraction \
            ${{ inputs.accept_destroys && '--accept' || '' }}
          terraform -chdir=infra/extraction apply -auto-approve tfplan

  batch:
    name: "apply · batch (opt-in)"
    if: inputs.include_batch
    needs: extraction
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: resolve what bootstrap published
        run: |
          set -euo pipefail
          # Assigned to a variable first, deliberately. `echo "X=$(aws ...)"` succeeds when the
          # `aws` call fails — the echo is the command `set -e` judges — and writes an empty
          # value, which surfaces four minutes later as `-backend-config="bucket="`. An
          # assignment is the form whose failure `set -e` actually sees.
          TF_STATE_BUCKET=$(aws ssm get-parameter \
            --name "/${{ env.PROJECT }}/bootstrap/state_bucket" \
            --query 'Parameter.Value' --output text)
          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_ENV"
          echo "resolved from /${{ env.PROJECT }}/bootstrap/*"
      - name: resolve what foundation published
        run: |
          set -euo pipefail
          resolved=0
          while read -r name value; do
            echo "TF_VAR_${name}=${value}" >> "$GITHUB_ENV"
            resolved=$((resolved + 1))
          done < <(
            aws ssm get-parameters-by-path \
              --path "/${{ env.PROJECT }}/foundation" \
              --query 'Parameters[].[Name,Value]' --output text \
              | sed "s|/${{ env.PROJECT }}/foundation/||"
          )
          # An empty path is not an empty result, it is a missing foundation — and `set -e`
          # cannot see it, because reading nothing is a successful read. Left unchecked this
          # job would carry on, set no variables, and stop at an input prompt with no terminal
          # to appear on: the same failure the required-variable gate was written to close,
          # arriving through a different door.
          if [ "$resolved" -eq 0 ]; then
            echo "::error::nothing published under /${{ env.PROJECT }}/foundation/ — apply the foundation layer first"
            exit 1
          fi
          echo "resolved $resolved reference(s) from /${{ env.PROJECT }}/foundation/*"
      - name: resolve what extraction published
        run: |
          set -euo pipefail
          resolved=0
          while read -r name value; do
            echo "TF_VAR_${name}=${value}" >> "$GITHUB_ENV"
            resolved=$((resolved + 1))
          done < <(
            aws ssm get-parameters-by-path \
              --path "/${{ env.PROJECT }}/extraction" \
              --query 'Parameters[].[Name,Value]' --output text \
              | sed "s|/${{ env.PROJECT }}/extraction/||"
          )
          if [ "$resolved" -eq 0 ]; then
            echo "::error::nothing published under /${{ env.PROJECT }}/extraction/ — apply the extraction layer first"
            exit 1
          fi
          echo "resolved $resolved reference(s) from /${{ env.PROJECT }}/extraction/*"
      - name: resolve what lakehouse published
        run: |
          set -euo pipefail
          resolved=0
          while read -r name value; do
            echo "TF_VAR_${name}=${value}" >> "$GITHUB_ENV"
            resolved=$((resolved + 1))
          done < <(
            aws ssm get-parameters-by-path \
              --path "/${{ env.PROJECT }}/lakehouse" \
              --query 'Parameters[].[Name,Value]' --output text \
              | sed "s|/${{ env.PROJECT }}/lakehouse/||"
          )
          if [ "$resolved" -eq 0 ]; then
            echo "::error::nothing published under /${{ env.PROJECT }}/lakehouse/ — apply the lakehouse layer first"
            exit 1
          fi
          echo "resolved $resolved reference(s) from /${{ env.PROJECT }}/lakehouse/*"
      - name: build the job's interpreter image
        # **The application runs Python 3.9 without this, and the job refuses to start on it.**
        #
        # `manifest.core.scale` needs 3.12 and `pipelines/reprocess.py` says so on the driver,
        # by name, before an executor is allocated — which is the right failure and is still a
        # bulk path that cannot run. `Dockerfile.emr` is the smallest thing that fixes it: an
        # interpreter and the AWS SDK, and deliberately no reader. Decision 23 has the argument.
        id: job_image
        run: |
          set -euo pipefail
          repository="${TF_VAR_job_repository_url%%/*}"
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin "$repository"
          docker build -f Dockerfile.emr -t "$TF_VAR_job_repository_url:${{ github.sha }}" .
          docker push "$TF_VAR_job_repository_url:${{ github.sha }}"
          echo "uri=$TF_VAR_job_repository_url:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: package the reprocessing job
        # **The driver and the code it imports, from this commit, in one place.**
        #
        # EMR Serverless takes an entry point and a `--py-files` archive from object storage;
        # neither is built by Terraform, and a layer that applied without them would create an
        # application whose first submission fails on a missing script. Uploaded here so the two
        # travel with the layer that points at them, exactly like the extraction handler's zip.
        #
        # `contracts/` is not in the archive and does not need to be: the job decides nothing, so
        # it reads no contract. The per-document pipeline it starts carries its own.
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp -r src/manifest "$staging/manifest"
          (cd "$staging" && zip -qr "$GITHUB_WORKSPACE/manifest.zip" manifest)
          # **Both keys written out, not built by expansion.** `scripts/check_deploy_path.py`
          # reads this file to prove that every object the submitter points a job run at is an
          # object this step uploads — and a key assembled from `${file##*:}` is a key no check
          # and no reader can see. It was written that way first and the check caught it, which
          # is the check working rather than a style note.
          aws s3api put-object \
            --bucket "$TF_VAR_records_bucket" \
            --key "jobs/reprocess/reprocess.py" \
            --body pipelines/reprocess.py \
            --server-side-encryption aws:kms \
            --ssekms-key-id "$TF_VAR_data_key_arn" >/dev/null
          aws s3api put-object \
            --bucket "$TF_VAR_records_bucket" \
            --key "jobs/reprocess/manifest.zip" \
            --body "$GITHUB_WORKSPACE/manifest.zip" \
            --server-side-encryption aws:kms \
            --ssekms-key-id "$TF_VAR_data_key_arn" >/dev/null
          echo "uploaded jobs/reprocess/reprocess.py and jobs/reprocess/manifest.zip"
      - name: apply
        run: |
          terraform -chdir=infra/batch init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=${{ env.AWS_REGION }}"
          terraform -chdir=infra/batch plan -out=tfplan \
            -var 'expires_at=${{ inputs.expires_at }}' \
            -var "job_image_uri=${{ steps.job_image.outputs.uri }}"
          terraform -chdir=infra/batch show -json tfplan > infra/batch/tfplan.json
          # A plan carrying deletions stops here unless the dispatch said so. Every
          # feature flag on this workflow defaults to `false`, so a dispatch that forgets
          # one asks to tear that feature down — and one did, silently, on 2026-08-14.
          python3 scripts/check_plan_destroys.py infra/batch/tfplan.json --layer batch \
            ${{ inputs.accept_destroys && '--accept' || '' }}
          terraform -chdir=infra/batch apply -auto-approve tfplan

