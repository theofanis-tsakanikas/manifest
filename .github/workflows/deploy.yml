          # cannot see it, because reading nothing is a successful read. Left unchecked this
          # job would carry on, set no variables, and stop at an input prompt with no terminal
          # to appear on: the same failure the required-variable gate was written to close,
          # arriving through a different door.
          if [ "$resolved" -eq 0 ]; then
            echo "::error::nothing published under /${{ env.PROJECT }}/foundation/ — apply the foundation layer first"
            exit 1
          fi
          echo "resolved $resolved reference(s) from /${{ env.PROJECT }}/foundation/*"
      - name: apply
        run: |
          terraform -chdir=infra/batch init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=${{ env.AWS_REGION }}"
          terraform -chdir=infra/batch apply -auto-approve -var 'expires_at=${{ inputs.expires_at }}'

  analytics:
    name: "apply · analytics (opt-in)"
    if: inputs.include_expensive_layers
    needs: batch
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: resolve what bootstrap published
        run: |
          set -euo pipefail
          # Assigned to a variable first, deliberately. `echo "X=$(aws ...)"` succeeds when the
          # `aws` call fails — the echo is the command `set -e` judges — and writes an empty
          # value, which surfaces four minutes later as `-backend-config="bucket="`. An
          # assignment is the form whose failure `set -e` actually sees.
          TF_STATE_BUCKET=$(aws ssm get-parameter \
            --name "/${{ env.PROJECT }}/bootstrap/state_bucket" \
            --query 'Parameter.Value' --output text)
          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_ENV"
          echo "resolved from /${{ env.PROJECT }}/bootstrap/*"
      - name: resolve what foundation published
        run: |
          set -euo pipefail
          resolved=0
          while read -r name value; do
            echo "TF_VAR_${name}=${value}" >> "$GITHUB_ENV"
            resolved=$((resolved + 1))
          done < <(
            aws ssm get-parameters-by-path \
              --path "/${{ env.PROJECT }}/foundation" \
              --query 'Parameters[].[Name,Value]' --output text \
              | sed "s|/${{ env.PROJECT }}/foundation/||"
          )
          # An empty path is not an empty result, it is a missing foundation — and `set -e`
          # cannot see it, because reading nothing is a successful read. Left unchecked this
          # job would carry on, set no variables, and stop at an input prompt with no terminal
          # to appear on: the same failure the required-variable gate was written to close,
          # arriving through a different door.
          if [ "$resolved" -eq 0 ]; then
            echo "::error::nothing published under /${{ env.PROJECT }}/foundation/ — apply the foundation layer first"
            exit 1
          fi
          echo "resolved $resolved reference(s) from /${{ env.PROJECT }}/foundation/*"
      - name: apply
        run: |
          terraform -chdir=infra/analytics init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=${{ env.AWS_REGION }}"
          terraform -chdir=infra/analytics apply -auto-approve -var 'expires_at=${{ inputs.expires_at }}'
