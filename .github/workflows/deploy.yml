# The deploy path. **Written, gated, and dispatched — for the first time on 2026-08-10.**
#
# `docs/DECISIONS.md` 14. For most of this repository's life the header here read "never
# dispatched", and that sentence was true when it was written and false the moment the first
# apply succeeded. It is corrected rather than quietly left, because a repository describing a
# posture it no longer holds is the same defect whichever way the error points.
#
# What the first dispatch found is the argument for having built the path before using it: a
# security group that dropped every packet to the S3 gateway endpoint without erroring, a
# reader whose version did not match the recording every threshold was derived from, and
# fourteen missing IAM grants that no offline check could have known about. None of them were
# visible from `terraform validate`, and all of them were cheap here and expensive later.
#
# What it did **not** license is in decision 14 and is worth reading before quoting anything
# from this estate: no managed extraction engine was called, no distributed job ran, and every
# cost figure in this repository is still modelled.
#
# Three properties make it a gate rather than a button.
#
# **It re-runs CI against the exact ref being deployed.** Not "CI passed on main last Tuesday"
# — the same commit, now. Without `workflow_call` in ci.yml this `uses:` is not a reusable
# workflow at all and the deploy fails before its first step, which is how a repository ends up
# with a deploy path nobody has ever successfully started.
#
# **Every job names its environment, and that is load-bearing rather than a policy.** The
# OIDC trust in `infra/bootstrap` lists
# `repo:owner/repo:environment:deploy` and nothing else, so a workflow run from any other
# context cannot assume the role at all — the gate is in the trust policy, not only in this
# file.
#
# **Layers apply in dependency order, one at a time.** Foundation makes the network and the
# keys every other layer takes as variables; nothing reads another layer's state, so the order
# here is the whole of the dependency graph and it is legible.

name: deploy

on:
  workflow_dispatch:
    inputs:
      expires_at:
        description: "ISO date after which the reaper may destroy this estate. No default."
        required: true
        type: string
      include_analytics:
        description: >-
          Stand up the Redshift workgroup and its marts. Off by default. Separate from `batch`
          because they are different costs answering different questions, and one flag for two
          bills is a flag nobody can reason about.
        type: boolean
        default: false
      include_batch:
        description: >-
          Stand up EMR Serverless for bulk reprocessing. Off by default.
        type: boolean
        default: false
      enable_escalation_tiers:
        description: >-
          Call Textract, Bedrock Data Automation and Bedrock when tier 0 abstains — the first
          billed reading this project performs. Off by default: with it off the escalation
          states are not in the machine, the function is not created, and the VPC endpoints
          those services answer on are not stood up. Nothing is present-and-disabled.
        type: boolean
        default: false
      enable_search:
        description: >-
          Stand up the OpenSearch Serverless collection over published records, the pipeline
          step that writes to it and the function that reads it back. Off by default — it bills
          per OCU-hour against an always-on floor, whether or not anybody searches.
        type: boolean
        default: false
      enable_classifier:
        description: >-
          Stand up the tariff-classification endpoint, fit its artefact and deploy the function
          that calls it. Off by default: serverless inference bills per request rather than per
          hour, but every proposal it produces lands in a review queue with a declared capacity,
          so switching it on is a decision about the queue as much as about the bill.
        type: boolean
        default: false
      accept_destroys:
        description: >-
          Allow an apply whose plan deletes resources. Off by default, and the default is the
          control: every feature flag above defaults to `false`, so a dispatch that forgets one
          asks to tear that feature down without ever saying so. It happened — a deploy sent to
          change one line in a state machine removed the search collection, its policies and its
          VPC endpoint, and reported success. Switch this on to shrink the estate deliberately;
          the deletions are listed either way.
        type: boolean
        default: false
      confirm:
        description: 'Type "apply" to confirm. Nothing in this repository has ever been applied.'
        required: true
        type: string

permissions:
  contents: read
  id-token: write # OIDC. There is no access key anywhere in this repository.

concurrency:
  # One deploy at a time, and never cancelled mid-apply: a cancelled apply leaves state that
  # describes half an estate, and the next plan wants to destroy things nobody created.
  group: deploy
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.5"
  AWS_REGION: eu-central-1
  # **This was missing, and it cost the first real deploy.**
  #
  # `${{ env.PROJECT }}` appears in the role ARN and in every SSM path in this file. Undefined,
  # it renders as the empty string: the deploy tried to assume `role/-deploy` and read
  # `//bootstrap/state_bucket`, and the error it produced was *"Not authorized to perform
  # sts:AssumeRoleWithWebIdentity"* — which reads as a trust-policy problem and sent the
  # investigation to the OIDC provider, the audience and the subject claim before the ARN.
  #
  # `destroy.yml` had it. This file did not, and nothing compared them: an undefined variable
  # in GitHub Actions is not an error, it is an empty string.
  PROJECT: manifest

jobs:
  confirm:
    name: confirm the intent
    runs-on: ubuntu-latest
    steps:
      - name: refuse anything but the word
        if: inputs.confirm != 'apply'
        run: |
          echo "This workflow applies real infrastructure and bills a real account."
          echo "Type 'apply' in the confirm input to proceed."
          exit 1

  ci:
    name: the whole suite, against this ref
    needs: confirm
    uses: ./.github/workflows/ci.yml
    # **Accepted, dated, and refused once it expires** — `contracts/ci/acceptance.yaml`.
    #
    # The corpus job is 24 of this gate's 36 minutes and the applies are 3. It proves the
    # generator is deterministic, which is a property of the repository rather than of the
    # deployment, and it has already passed on this commit in the push run. Skipping it here
    # buys a three-fold cycle time during the period when the estate is being brought up and
    # torn down repeatedly; it is not a permanent posture and the acceptance says when it ends.
    with:
      run_corpus: "false"

  foundation:
    name: "apply · foundation"
    needs: ci
    runs-on: ubuntu-latest
    # The environment the OIDC trust is scoped to. A run outside it cannot obtain
    # credentials at all — which is why this line cannot be forgotten, unlike a policy.
    #
    # **Required reviewers are currently OFF**, deliberately, so that a first deploy can be
    # iterated on without a person approving each attempt to discover what is broken. That is
    # recorded with a name, a reason and an expiry in `contracts/deploy/acceptance.yaml`, and
    # `scripts/check_deploy_path.py` refuses a missing or expired one.
    environment: deploy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          # Constructed, not transcribed. The role name is a constant this repository owns;
          # the account id is the single value CI cannot derive.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: resolve what bootstrap published
        # Everything below is a consequence of a name `infra/bootstrap` already chose, so it is
        # read from that layer rather than copied into repository configuration. A copied value
        # looks like an independent setting: rename the state bucket and this becomes a deploy
        # that fails on a backend nobody can find, with the fix in a settings page instead of a
        # diff.
        #
        # The account id is the one value that cannot be resolved this way — CI has to know
        # *which* account before it can ask that account anything, and reading a parameter is
        # already asking.
        run: |
          set -euo pipefail
          read_param() {
            aws ssm get-parameter --name "/${{ env.PROJECT }}/bootstrap/$1" \
              --with-decryption --query 'Parameter.Value' --output text
          }
          # Assigned first, for the reason above: inside an `echo`, a failed read is a
          # successful command that writes an empty value.
          TF_STATE_BUCKET=$(read_param state_bucket)
          BUDGET_EMAIL=$(read_param budget_notification_email)
          # The escalation model, read here rather than in a step of its own. It is a value
          # `infra/bootstrap` published like the others, and a separate step is a step that can
          # be added to one job and forgotten in another — which is exactly what happened: the
          # extraction job passed an empty `escalation_model_arns` and the variable's own
          # validation refused it, after the image had been built and pushed.
          ESCALATION_MODEL_ARN=$(read_param escalation_model_arn)
          # **The profile is not the only thing a Converse call is authorised against.**
          #
          # A cross-Region inference profile routes to a foundation model in a Region Bedrock
          # picks at call time, and IAM checks `bedrock:InvokeModel` on *that* ARN too. The first
          # Greek page was refused on `eu-north-1` — a Region this estate does not deploy into
          # and names nowhere. Which Regions a profile spans is AWS's decision and changes
          # without notice, so the list is asked for rather than written down.
          #
          # Resolved here rather than by a Terraform data source, deliberately: a data source
          # would make `terraform plan` require a real profile, and the offline check that plans
          # every optional feature with its flag on and off would need an account to run.
          # The profile ARN goes in as an argument, not an environment variable. A `VAR=x cmd`
          # prefix applies to `cmd` alone, and in a pipeline that is the *first* stage — so
          # `PROFILE_ARN=... aws ... | python3` set it for `aws`, which never reads it, and left
          # `python3` with a `KeyError`. It passed locally because the local test exported it
          # first, which is the one difference that made the two behave differently.
          ESCALATION_MODEL_ARNS=$(
            aws bedrock get-inference-profile \
              --inference-profile-identifier "${ESCALATION_MODEL_ARN##*/}" \
              --query 'models[].modelArn' --output json \
            | python3 -c 'import json, sys; print(json.dumps([sys.argv[1], *json.load(sys.stdin)]))' \
                "$ESCALATION_MODEL_ARN"
          )
          if [ -z "$ESCALATION_MODEL_ARNS" ] || [ "$ESCALATION_MODEL_ARNS" = "[]" ]; then
            echo "::error::the inference profile ${ESCALATION_MODEL_ARN##*/} resolved to no models; the escalation would be granted nothing to call"
            exit 1
          fi
          {
            echo "TF_STATE_BUCKET=$TF_STATE_BUCKET"
            echo "BUDGET_EMAIL=$BUDGET_EMAIL"
            echo "ESCALATION_MODEL_ARN=$ESCALATION_MODEL_ARN"
            echo "ESCALATION_MODEL_ARNS=$ESCALATION_MODEL_ARNS"
          } >> "$GITHUB_ENV"
          echo "resolved from /${{ env.PROJECT }}/bootstrap/*"
      - name: init
        run: terraform -chdir=infra/foundation init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=${{ env.AWS_REGION }}"
      - name: plan
        run: |
          terraform -chdir=infra/foundation plan -out=tfplan \
            -var 'expires_at=${{ inputs.expires_at }}' \
            -var "budget_notification_email=$BUDGET_EMAIL" \
            -var "enable_escalation_tiers=${{ inputs.enable_escalation_tiers }}" \
            -var "enable_classifier=${{ inputs.enable_classifier }}"
      - name: refuse deletions nobody asked for
        # A plan carrying deletions stops here unless the dispatch said so. Every feature flag
        # on this workflow defaults to `false`, so a dispatch that forgets one asks to tear that
        # feature down — and one did, silently, on 2026-08-14.
        run: |
          terraform -chdir=infra/foundation show -json tfplan > infra/foundation/tfplan.json
          python3 scripts/check_plan_destroys.py infra/foundation/tfplan.json --layer foundation \
            ${{ inputs.accept_destroys && '--accept' || '' }}
      - name: apply
        run: terraform -chdir=infra/foundation apply -auto-approve tfplan

  # Every layer below takes foundation's references as *variables*, resolved from
  # `/manifest/foundation/*` — see `infra/foundation/published.tf` for the short, deliberate
  # list of what a layer offers its neighbours.
  #
  # Never a remote state read: that makes one layer's internals another layer's contract, needs
  # every consumer to hold read access to the state bucket, and turns the blast radius of a bug
  # in the smallest layer into the blast radius of the largest. The two could then not be
  # destroyed separately either — which is the property `destroy.yml` depends on.
  lakehouse:
    name: "apply · lakehouse"
    needs: foundation
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          # Constructed, not transcribed. The role name is a constant this repository owns;
          # the account id is the single value CI cannot derive.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: resolve what bootstrap published
        # Everything below is a consequence of a name `infra/bootstrap` already chose, so it is
        # read from that layer rather than copied into repository configuration. A copied value
        # looks like an independent setting: rename the state bucket and this becomes a deploy
        # that fails on a backend nobody can find, with the fix in a settings page instead of a
        # diff.
        #
        # The account id is the one value that cannot be resolved this way — CI has to know
        # *which* account before it can ask that account anything, and reading a parameter is
        # already asking.
        run: |
          set -euo pipefail
          read_param() {
            aws ssm get-parameter --name "/${{ env.PROJECT }}/bootstrap/$1" \
              --with-decryption --query 'Parameter.Value' --output text
          }
          # Assigned first, for the reason above: inside an `echo`, a failed read is a
          # successful command that writes an empty value.
          TF_STATE_BUCKET=$(read_param state_bucket)
          BUDGET_EMAIL=$(read_param budget_notification_email)
          # The escalation model, read here rather than in a step of its own. It is a value
          # `infra/bootstrap` published like the others, and a separate step is a step that can
          # be added to one job and forgotten in another — which is exactly what happened: the
          # extraction job passed an empty `escalation_model_arns` and the variable's own
          # validation refused it, after the image had been built and pushed.
          ESCALATION_MODEL_ARN=$(read_param escalation_model_arn)
          # **The profile is not the only thing a Converse call is authorised against.**
          #
          # A cross-Region inference profile routes to a foundation model in a Region Bedrock
          # picks at call time, and IAM checks `bedrock:InvokeModel` on *that* ARN too. The first
          # Greek page was refused on `eu-north-1` — a Region this estate does not deploy into
          # and names nowhere. Which Regions a profile spans is AWS's decision and changes
          # without notice, so the list is asked for rather than written down.
          #
          # Resolved here rather than by a Terraform data source, deliberately: a data source
          # would make `terraform plan` require a real profile, and the offline check that plans
          # every optional feature with its flag on and off would need an account to run.
          # The profile ARN goes in as an argument, not an environment variable. A `VAR=x cmd`
          # prefix applies to `cmd` alone, and in a pipeline that is the *first* stage — so
          # `PROFILE_ARN=... aws ... | python3` set it for `aws`, which never reads it, and left
          # `python3` with a `KeyError`. It passed locally because the local test exported it
          # first, which is the one difference that made the two behave differently.
