            ${{ inputs.accept_destroys && '--accept' || '' }}
          terraform -chdir=infra/analytics apply -auto-approve tfplan
      - name: create the warehouse schema and run every mart against it
        # **A workgroup with no tables in it is the analytics layer's version of the lake being
        # a schema over nothing.** Redshift stood up, answered `select 1`, and held nothing but
        # its own internal catalogue: `analytics/schema.sql` had never been executed by
        # anything, and `check_marts.py` — which proves offline that no mart reads an undeclared
        # column — is exactly the check that cannot notice the schema is absent.
        #
        # The marts are then *run*, not parsed. A mart that parses and a mart that executes are
        # different claims, and the distance between them is every function name, cast and join
        # Redshift disagrees with.
        run: |
          set -euo pipefail
          # `--upgrade`, because the runner ships a boto3 old enough not to know
          # `bedrock-data-automation` exists at all: *"Unknown service"*, with a list of two
          # hundred valid names that does not include it. Installing without it is a no-op
          # against the preinstalled version, which is the shape that looks like a dependency
          # being handled.
