# The deploy path. **Written, gated, and never dispatched.**
#
# `docs/DECISIONS.md` 14: nothing in this repository is ever applied to AWS. This file exists
# because "ready to deploy" is a claim about a path that can be inspected, and a repository
# that says it is ready without one is asking to be taken at its word.
#
# Three properties make it a gate rather than a button.
#
# **It re-runs CI against the exact ref being deployed.** Not "CI passed on main last Tuesday"
# — the same commit, now. Without `workflow_call` in ci.yml this `uses:` is not a reusable
# workflow at all and the deploy fails before its first step, which is how a repository ends up
# with a deploy path nobody has ever successfully started.
#
# **Every job names a protected environment.** The OIDC trust in `infra/bootstrap` lists
# `repo:owner/repo:environment:deploy` and nothing else, so a workflow run from any other
# context cannot assume the role at all — the gate is in the trust policy, not only in this
# file.
#
# **Layers apply in dependency order, one at a time.** Foundation makes the network and the
# keys every other layer takes as variables; nothing reads another layer's state, so the order
# here is the whole of the dependency graph and it is legible.

name: deploy

on:
  workflow_dispatch:
    inputs:
      expires_at:
        description: "ISO date after which the reaper may destroy this estate. No default."
        required: true
        type: string
      include_expensive_layers:
        description: >-
          Also stand up EMR Serverless and the Redshift workgroup. Off by default, and the
          default is the point: these two are the estate's cost, and an estate that stands them
          up because a deploy ran is an estate whose bill is decided by a default.
        type: boolean
        default: false
      confirm:
        description: 'Type "apply" to confirm. Nothing in this repository has ever been applied.'
        required: true
        type: string

permissions:
  contents: read
  id-token: write # OIDC. There is no access key anywhere in this repository.

concurrency:
  # One deploy at a time, and never cancelled mid-apply: a cancelled apply leaves state that
  # describes half an estate, and the next plan wants to destroy things nobody created.
  group: deploy
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.5"
  AWS_REGION: eu-central-1

jobs:
  confirm:
    name: confirm the intent
    runs-on: ubuntu-latest
    steps:
      - name: refuse anything but the word
        if: inputs.confirm != 'apply'
        run: |
          echo "This workflow applies real infrastructure and bills a real account."
          echo "Type 'apply' in the confirm input to proceed."
          exit 1

  ci:
    name: the whole suite, against this ref
    needs: confirm
    uses: ./.github/workflows/ci.yml

  foundation:
    name: "apply · foundation"
    needs: ci
    runs-on: ubuntu-latest
    environment: deploy # The protected environment. Approval happens here.
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Constructed, not transcribed. The role name is a constant this repository owns;
          # the account id is the single value CI cannot derive.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: resolve what bootstrap published
        # Everything below is a consequence of a name `infra/bootstrap` already chose, so it is
        # read from that layer rather than copied into repository configuration. A copied value
        # looks like an independent setting: rename the state bucket and this becomes a deploy
        # that fails on a backend nobody can find, with the fix in a settings page instead of a
        # diff.
        #
        # The account id is the one value that cannot be resolved this way — CI has to know
        # *which* account before it can ask that account anything, and reading a parameter is
        # already asking.
        run: |
          set -euo pipefail
          read_param() {
            aws ssm get-parameter --name "/${{ env.PROJECT }}/bootstrap/$1" \
              --with-decryption --query 'Parameter.Value' --output text
          }
          # Assigned first, for the reason above: inside an `echo`, a failed read is a
          # successful command that writes an empty value.
          TF_STATE_BUCKET=$(read_param state_bucket)
          BUDGET_EMAIL=$(read_param budget_notification_email)
          {
            echo "TF_STATE_BUCKET=$TF_STATE_BUCKET"
            echo "BUDGET_EMAIL=$BUDGET_EMAIL"
          } >> "$GITHUB_ENV"
          echo "resolved from /${{ env.PROJECT }}/bootstrap/*"
      - name: init
        run: terraform -chdir=infra/foundation init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=${{ env.AWS_REGION }}"
      - name: plan
        run: |
          terraform -chdir=infra/foundation plan -out=tfplan \
            -var 'expires_at=${{ inputs.expires_at }}' \
            -var "budget_notification_email=$BUDGET_EMAIL"
      - name: apply
        run: terraform -chdir=infra/foundation apply -auto-approve tfplan

  # Every layer below takes foundation's references as *variables*, resolved from
  # `/manifest/foundation/*` — see `infra/foundation/published.tf` for the short, deliberate
  # list of what a layer offers its neighbours.
  #
  # Never a remote state read: that makes one layer's internals another layer's contract, needs
  # every consumer to hold read access to the state bucket, and turns the blast radius of a bug
  # in the smallest layer into the blast radius of the largest. The two could then not be
  # destroyed separately either — which is the property `destroy.yml` depends on.
  extraction:
    name: "apply · extraction"
    needs: foundation
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Constructed, not transcribed. The role name is a constant this repository owns;
          # the account id is the single value CI cannot derive.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: resolve what bootstrap published
        # Everything below is a consequence of a name `infra/bootstrap` already chose, so it is
        # read from that layer rather than copied into repository configuration. A copied value
        # looks like an independent setting: rename the state bucket and this becomes a deploy
        # that fails on a backend nobody can find, with the fix in a settings page instead of a
        # diff.
        #
        # The account id is the one value that cannot be resolved this way — CI has to know
        # *which* account before it can ask that account anything, and reading a parameter is
        # already asking.
        run: |
          set -euo pipefail
          read_param() {
            aws ssm get-parameter --name "/${{ env.PROJECT }}/bootstrap/$1" \
              --with-decryption --query 'Parameter.Value' --output text
          }
          # Assigned first, for the reason above: inside an `echo`, a failed read is a
          # successful command that writes an empty value.
          TF_STATE_BUCKET=$(read_param state_bucket)
          BUDGET_EMAIL=$(read_param budget_notification_email)
          {
            echo "TF_STATE_BUCKET=$TF_STATE_BUCKET"
            echo "BUDGET_EMAIL=$BUDGET_EMAIL"
          } >> "$GITHUB_ENV"
          echo "resolved from /${{ env.PROJECT }}/bootstrap/*"
      - name: resolve what foundation published
        # From SSM, not from a CI artifact. The artifact existed for exactly one workflow run,
        # so dispatching this layer on its own found nothing — and `batch` and `analytics` had
        # no path at all, because no run had ever produced one for them.
        run: |
          set -euo pipefail
          resolved=0
          while read -r name value; do
            echo "TF_VAR_${name}=${value}" >> "$GITHUB_ENV"
            resolved=$((resolved + 1))
          done < <(
            aws ssm get-parameters-by-path \
              --path "/${{ env.PROJECT }}/foundation" \
              --query 'Parameters[].[Name,Value]' --output text \
              | sed "s|/${{ env.PROJECT }}/foundation/||"
          )
          # An empty path is not an empty result, it is a missing foundation — and `set -e`
          # cannot see it, because reading nothing is a successful read. Left unchecked this
          # job would carry on, set no variables, and stop at an input prompt with no terminal
          # to appear on: the same failure the required-variable gate was written to close,
          # arriving through a different door.
          if [ "$resolved" -eq 0 ]; then
            echo "::error::nothing published under /${{ env.PROJECT }}/foundation/ — apply the foundation layer first"
            exit 1
          fi
          echo "resolved $resolved reference(s) from /${{ env.PROJECT }}/foundation/*"
      - name: build and push the reader image
        # **The reader binary is the artefact.** Every confidence threshold in this repository
        # was derived from one build of it, so the functions are pinned to a *digest* rather
        # than a tag: a tag says what somebody meant, a digest says what is there. The image
        # itself refuses to build if the reader version or any language pack is not what the
        # recording ceremony expects — see the Dockerfile.
        id: image
        run: |
          set -euo pipefail
          registry="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          repository="$registry/${{ env.PROJECT }}-reader"
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "$registry"
          # Tagged by commit, never `latest`. The repository is IMMUTABLE, so a tag cannot be
          # moved onto a different build after the fact.
          docker build -t "$repository:${{ github.sha }}" .
          docker push "$repository:${{ github.sha }}"
          digest=$(aws ecr describe-images \
            --repository-name "${{ env.PROJECT }}-reader" \
            --image-ids imageTag=${{ github.sha }} \
            --query 'imageDetails[0].imageDigest' --output text)
          if [ -z "$digest" ] || [ "$digest" = "None" ]; then
            echo "::error::the image pushed but no digest came back; refusing to deploy a function pinned to nothing"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: package the extraction handler
        # Code and contracts from the same commit, in one artefact. A deployment where they came
        # from different revisions would apply one version's comparison rules to another
        # version's fields, and nothing anywhere would report it.
        id: package
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          python -m pip install --quiet --target "$staging" .
          cp -r contracts "$staging/contracts"
          (cd "$staging" && zip -qr "$GITHUB_WORKSPACE/publish.zip" .)
          key="artifacts/publish-${{ github.sha }}.zip"
          aws s3api put-object \
            --bucket "$TF_VAR_records_bucket" \
            --key "$key" \
            --body "$GITHUB_WORKSPACE/publish.zip" \
            --server-side-encryption aws:kms \
            --ssekms-key-id "$TF_VAR_data_key_arn" >/dev/null
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "hash=$(openssl dgst -sha256 -binary "$GITHUB_WORKSPACE/publish.zip" | base64)" >> "$GITHUB_OUTPUT"
      - name: apply
        run: |
          terraform -chdir=infra/extraction init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=${{ env.AWS_REGION }}"
          terraform -chdir=infra/extraction apply -auto-approve \
            -var 'expires_at=${{ inputs.expires_at }}' \
            -var "reader_image_digest=${{ steps.image.outputs.digest }}" \
            -var "publish_package_key=${{ steps.package.outputs.key }}" \
            -var "publish_package_hash=${{ steps.package.outputs.hash }}" \
            -var "escalation_model_arns=[\"$ESCALATION_MODEL_ARN\"]"

  lakehouse:
    name: "apply · lakehouse"
    needs: extraction
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Constructed, not transcribed. The role name is a constant this repository owns;
          # the account id is the single value CI cannot derive.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: resolve what bootstrap published
        # Everything below is a consequence of a name `infra/bootstrap` already chose, so it is
        # read from that layer rather than copied into repository configuration. A copied value
        # looks like an independent setting: rename the state bucket and this becomes a deploy
        # that fails on a backend nobody can find, with the fix in a settings page instead of a
        # diff.
        #
        # The account id is the one value that cannot be resolved this way — CI has to know
        # *which* account before it can ask that account anything, and reading a parameter is
        # already asking.
        run: |
          set -euo pipefail
          read_param() {
            aws ssm get-parameter --name "/${{ env.PROJECT }}/bootstrap/$1" \
              --with-decryption --query 'Parameter.Value' --output text
          }
          # Assigned first, for the reason above: inside an `echo`, a failed read is a
          # successful command that writes an empty value.
          TF_STATE_BUCKET=$(read_param state_bucket)
          BUDGET_EMAIL=$(read_param budget_notification_email)
          {
            echo "TF_STATE_BUCKET=$TF_STATE_BUCKET"
            echo "BUDGET_EMAIL=$BUDGET_EMAIL"
          } >> "$GITHUB_ENV"
          echo "resolved from /${{ env.PROJECT }}/bootstrap/*"
      - name: resolve what foundation published
        # From SSM, not from a CI artifact. The artifact existed for exactly one workflow run,
        # so dispatching this layer on its own found nothing — and `batch` and `analytics` had
        # no path at all, because no run had ever produced one for them.
        run: |
          set -euo pipefail
          resolved=0
          while read -r name value; do
            echo "TF_VAR_${name}=${value}" >> "$GITHUB_ENV"
            resolved=$((resolved + 1))
          done < <(
            aws ssm get-parameters-by-path \
              --path "/${{ env.PROJECT }}/foundation" \
              --query 'Parameters[].[Name,Value]' --output text \
              | sed "s|/${{ env.PROJECT }}/foundation/||"
          )
          # An empty path is not an empty result, it is a missing foundation — and `set -e`
          # cannot see it, because reading nothing is a successful read. Left unchecked this
          # job would carry on, set no variables, and stop at an input prompt with no terminal
          # to appear on: the same failure the required-variable gate was written to close,
          # arriving through a different door.
          if [ "$resolved" -eq 0 ]; then
            echo "::error::nothing published under /${{ env.PROJECT }}/foundation/ — apply the foundation layer first"
            exit 1
          fi
          echo "resolved $resolved reference(s) from /${{ env.PROJECT }}/foundation/*"
      - name: apply
        run: |
          terraform -chdir=infra/lakehouse init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=${{ env.AWS_REGION }}"
          terraform -chdir=infra/lakehouse apply -auto-approve \
            -var 'expires_at=${{ inputs.expires_at }}'

  # `batch` and `analytics` are deliberately NOT applied by default. They are the two most
  # expensive layers in the estate — EMR Serverless and a Redshift workgroup — and an estate
  # that stands them up because a deploy ran is an estate whose cost is decided by a default.
  # They are separate dispatches with their own approval, which is the same discipline as
  # Attestor's OpenSearch: stand up, use, tear down, never leave standing.

  # ── The two expensive layers ────────────────────────────────────────────────
  #
  # EMR Serverless and a Redshift workgroup. They are **not** part of the default deploy — an
  # estate that stands them up because a deploy ran is an estate whose cost is decided by a
  # default — so each is its own dispatch with its own approval, the same discipline Attestor
  # applies to OpenSearch: stand up, use, tear down, never leave standing.
  #
  # They were previously described as separate dispatches and were not: no job existed, so two
  # of the six layers had no path at all. Written, validated and unreachable is a different
  # thing from written, validated and not run.
  batch:
    name: "apply · batch (opt-in)"
    if: inputs.include_expensive_layers
    needs: lakehouse
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: resolve what bootstrap published
        run: |
          set -euo pipefail
          # Assigned to a variable first, deliberately. `echo "X=$(aws ...)"` succeeds when the
          # `aws` call fails — the echo is the command `set -e` judges — and writes an empty
          # value, which surfaces four minutes later as `-backend-config="bucket="`. An
          # assignment is the form whose failure `set -e` actually sees.
          TF_STATE_BUCKET=$(aws ssm get-parameter \
            --name "/${{ env.PROJECT }}/bootstrap/state_bucket" \
            --query 'Parameter.Value' --output text)
          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_ENV"
          echo "resolved from /${{ env.PROJECT }}/bootstrap/*"
      - name: resolve what foundation published
        run: |
          set -euo pipefail
          resolved=0
          while read -r name value; do
            echo "TF_VAR_${name}=${value}" >> "$GITHUB_ENV"
            resolved=$((resolved + 1))
          done < <(
            aws ssm get-parameters-by-path \
              --path "/${{ env.PROJECT }}/foundation" \
              --query 'Parameters[].[Name,Value]' --output text \
              | sed "s|/${{ env.PROJECT }}/foundation/||"
          )
