                "$ESCALATION_MODEL_ARN"
          )
          if [ -z "$ESCALATION_MODEL_ARNS" ] || [ "$ESCALATION_MODEL_ARNS" = "[]" ]; then
            echo "::error::the inference profile ${ESCALATION_MODEL_ARN##*/} resolved to no models; the escalation would be granted nothing to call"
            exit 1
          fi
          {
            echo "TF_STATE_BUCKET=$TF_STATE_BUCKET"
            echo "BUDGET_EMAIL=$BUDGET_EMAIL"
            echo "ESCALATION_MODEL_ARN=$ESCALATION_MODEL_ARN"
            echo "ESCALATION_MODEL_ARNS=$ESCALATION_MODEL_ARNS"
          } >> "$GITHUB_ENV"
          echo "resolved from /${{ env.PROJECT }}/bootstrap/*"
      - name: resolve what foundation published
        # From SSM, not from a CI artifact. The artifact existed for exactly one workflow run,
        # so dispatching this layer on its own found nothing — and `batch` and `analytics` had
        # no path at all, because no run had ever produced one for them.
        run: |
          set -euo pipefail
          resolved=0
          while read -r name value; do
            echo "TF_VAR_${name}=${value}" >> "$GITHUB_ENV"
            resolved=$((resolved + 1))
          done < <(
            aws ssm get-parameters-by-path \
              --path "/${{ env.PROJECT }}/foundation" \
              --query 'Parameters[].[Name,Value]' --output text \
              | sed "s|/${{ env.PROJECT }}/foundation/||"
          )
          # An empty path is not an empty result, it is a missing foundation — and `set -e`
          # cannot see it, because reading nothing is a successful read. Left unchecked this
          # job would carry on, set no variables, and stop at an input prompt with no terminal
          # to appear on: the same failure the required-variable gate was written to close,
          # arriving through a different door.
          if [ "$resolved" -eq 0 ]; then
            echo "::error::nothing published under /${{ env.PROJECT }}/foundation/ — apply the foundation layer first"
            exit 1
          fi
          echo "resolved $resolved reference(s) from /${{ env.PROJECT }}/foundation/*"
      - name: apply
        run: |
          terraform -chdir=infra/lakehouse init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=${{ env.AWS_REGION }}"
          terraform -chdir=infra/lakehouse plan -out=tfplan \
            -var 'expires_at=${{ inputs.expires_at }}' \
            -var "enable_search=${{ inputs.enable_search }}"
          terraform -chdir=infra/lakehouse show -json tfplan > infra/lakehouse/tfplan.json
          # A plan carrying deletions stops here unless the dispatch said so. Every
          # feature flag on this workflow defaults to `false`, so a dispatch that forgets
          # one asks to tear that feature down — and one did, silently, on 2026-08-14.
          python3 scripts/check_plan_destroys.py infra/lakehouse/tfplan.json --layer lakehouse \
            ${{ inputs.accept_destroys && '--accept' || '' }}
          terraform -chdir=infra/lakehouse apply -auto-approve tfplan
      - name: evolve the table's schema, because the catalogue is not the schema
        # **Terraform creates this table and cannot change it.** For a Glue-managed Iceberg
        # table, `aws_glue_catalog_table`'s `columns` are the schema it is *created* with;
        # editing them afterwards updates the catalogue, reports success, and leaves the table
        # alone — Iceberg keeps its own metadata and that is what Athena reads. Four columns were
        # added that way and every query went on using the old schema until a loader failed two
        # layers later with `COLUMN_NOT_FOUND` about a column `get-table` listed.
        #
        # So evolution goes through `ALTER TABLE ADD COLUMNS`, here, after the layer applies and
        # before anything reads it. The script only ever adds: dropping or retyping a column is a
        # re-extraction event under `CLAUDE.md`'s contract rule and needs a version bump and a
        # diff, not a deploy step.
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade boto3
          python3 scripts/evolve_lake_schema.py

  # `batch` and `analytics` are deliberately NOT applied by default. They are the two most
  # expensive layers in the estate — EMR Serverless and a Redshift workgroup — and an estate
  # that stands them up because a deploy ran is an estate whose cost is decided by a default.
  # They are separate dispatches with their own approval, which is the same discipline as
  # Attestor's OpenSearch: stand up, use, tear down, never leave standing.

  # ── The two expensive layers ────────────────────────────────────────────────
  #
  # EMR Serverless and a Redshift workgroup. They are **not** part of the default deploy — an
  # estate that stands them up because a deploy ran is an estate whose cost is decided by a
  # default — so each is its own dispatch with its own approval, the same discipline Attestor
  # applies to OpenSearch: stand up, use, tear down, never leave standing.
  #
  # They were previously described as separate dispatches and were not: no job existed, so two
  # of the six layers had no path at all. Written, validated and unreachable is a different
  # thing from written, validated and not run.
  extraction:
    name: "apply · extraction"
    needs: lakehouse
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
