# The teardown path. **Not optional, and never dispatched.**
#
# A repository with a deploy path and no destroy path is how an estate gets left standing, and
# it is the difference between a portfolio piece and a bill. This file exists from the same
# commit as `deploy.yml` for that reason, and it is written to work on the day it is needed —
# which is a day when something has gone wrong and nobody wants to be reading Terraform.
#
# **Reverse dependency order, and it matters.** Foundation holds the KMS keys and the VPC every
# other layer's resources are encrypted with and attached to; destroying it first leaves
# orphaned resources that cannot be deleted because the key that encrypts them is scheduled for
# deletion. So the order here is the deploy order backwards, and each layer runs even if the
# one before it failed — `if: always()` — because a teardown that stops at the first error
# leaves exactly the expensive half standing.
#
# **The state bucket is not destroyed.** `infra/bootstrap` has `prevent_destroy` on it and this
# workflow does not touch that layer. Losing state does not lose the configuration; it loses the
# *mapping* to what exists, and an apply against a lost mapping creates a second estate beside
# the first.

name: destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the project name to confirm. This deletes data.'
        required: true
        type: string
      include_expensive:
        description: "Also destroy batch and analytics (they are separate dispatches on the way up)."
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: destroy
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.5"
  AWS_REGION: eu-central-1
  PROJECT: manifest

jobs:
  confirm:
    name: confirm the intent
    runs-on: ubuntu-latest
    steps:
      - name: refuse anything but the project name
        if: inputs.confirm != 'manifest'
        run: |
          echo "This workflow destroys infrastructure and the data in it."
          echo "Type the project name to proceed."
          exit 1

  analytics:
    name: "destroy · analytics"
    needs: confirm
    if: inputs.include_expensive
    runs-on: ubuntu-latest
    environment: destroy
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: resolve what bootstrap published
        # Same reason as the deploy: a transcribed value looks like an independent setting, and
        # a destroy pointed at the wrong state bucket is a destroy that reports success having
        # torn down nothing.
        run: |
          set -euo pipefail
          # Assigned to a variable first, deliberately. `echo "X=$(aws ...)"` succeeds when the
          # `aws` call fails — the echo is the command `set -e` judges — and writes an empty
          # value, which surfaces four minutes later as `-backend-config="bucket="`. An
          # assignment is the form whose failure `set -e` actually sees.
          TF_STATE_BUCKET=$(aws ssm get-parameter \
            --name "/${{ env.PROJECT }}/bootstrap/state_bucket" \
            --query 'Parameter.Value' --output text)
          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_ENV"
          echo "resolved from /${{ env.PROJECT }}/bootstrap/*"
      - name: resolve what foundation published
        # A destroy still has to evaluate the configuration, so every required variable still
        # has to resolve. `terraform validate` never asked for one, which is why this was
        # missing and looked fine.
        run: |
          set -euo pipefail
          resolved=0
          while read -r name value; do
            echo "TF_VAR_${name}=${value}" >> "$GITHUB_ENV"
            resolved=$((resolved + 1))
          done < <(
            aws ssm get-parameters-by-path \
              --path "/${{ env.PROJECT }}/foundation" \
              --query 'Parameters[].[Name,Value]' --output text \
              | sed "s|/${{ env.PROJECT }}/foundation/||"
          )
          # An empty path is not an empty result, it is a missing foundation — and `set -e`
          # cannot see it, because reading nothing is a successful read. Left unchecked this
          # job would carry on, set no variables, and stop at an input prompt with no terminal
          # to appear on: the same failure the required-variable gate was written to close,
          # arriving through a different door.
          if [ "$resolved" -eq 0 ]; then
            echo "::error::nothing published under /${{ env.PROJECT }}/foundation/ — apply the foundation layer first"
            exit 1
          fi
          echo "resolved $resolved reference(s) from /${{ env.PROJECT }}/foundation/*"
      - run: |
          terraform -chdir=infra/analytics init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=${{ env.AWS_REGION }}"
          terraform -chdir=infra/analytics destroy -auto-approve -refresh=false -var 'expires_at=1970-01-01'

  batch:
    name: "destroy · batch"
    needs: confirm
    if: inputs.include_expensive
    runs-on: ubuntu-latest
    environment: destroy
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: resolve what bootstrap published
        # Same reason as the deploy: a transcribed value looks like an independent setting, and
        # a destroy pointed at the wrong state bucket is a destroy that reports success having
        # torn down nothing.
        run: |
          set -euo pipefail
          # Assigned to a variable first, deliberately. `echo "X=$(aws ...)"` succeeds when the
          # `aws` call fails — the echo is the command `set -e` judges — and writes an empty
          # value, which surfaces four minutes later as `-backend-config="bucket="`. An
          # assignment is the form whose failure `set -e` actually sees.
          TF_STATE_BUCKET=$(aws ssm get-parameter \
            --name "/${{ env.PROJECT }}/bootstrap/state_bucket" \
            --query 'Parameter.Value' --output text)
          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_ENV"
          echo "resolved from /${{ env.PROJECT }}/bootstrap/*"
      - name: resolve what foundation published
        # A destroy still has to evaluate the configuration, so every required variable still
        # has to resolve. `terraform validate` never asked for one, which is why this was
        # missing and looked fine.
        run: |
          set -euo pipefail
          resolved=0
          while read -r name value; do
            echo "TF_VAR_${name}=${value}" >> "$GITHUB_ENV"
            resolved=$((resolved + 1))
          done < <(
            aws ssm get-parameters-by-path \
              --path "/${{ env.PROJECT }}/foundation" \
              --query 'Parameters[].[Name,Value]' --output text \
              | sed "s|/${{ env.PROJECT }}/foundation/||"
          )
          # An empty path is not an empty result, it is a missing foundation — and `set -e`
          # cannot see it, because reading nothing is a successful read. Left unchecked this
          # job would carry on, set no variables, and stop at an input prompt with no terminal
          # to appear on: the same failure the required-variable gate was written to close,
          # arriving through a different door.
          if [ "$resolved" -eq 0 ]; then
            echo "::error::nothing published under /${{ env.PROJECT }}/foundation/ — apply the foundation layer first"
            exit 1
          fi
          echo "resolved $resolved reference(s) from /${{ env.PROJECT }}/foundation/*"
      - run: |
          terraform -chdir=infra/batch init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=${{ env.AWS_REGION }}"
          terraform -chdir=infra/batch destroy -auto-approve -refresh=false -var 'expires_at=1970-01-01'

  lakehouse:
    name: "destroy · lakehouse"
    needs: [analytics, batch]
    # Always. A teardown that stops at the first failure leaves exactly the expensive half
    # standing, which is the failure mode this whole file exists to prevent.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    environment: destroy
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: resolve what bootstrap published
        # Same reason as the deploy: a transcribed value looks like an independent setting, and
        # a destroy pointed at the wrong state bucket is a destroy that reports success having
        # torn down nothing.
        run: |
          set -euo pipefail
          # Assigned to a variable first, deliberately. `echo "X=$(aws ...)"` succeeds when the
          # `aws` call fails — the echo is the command `set -e` judges — and writes an empty
          # value, which surfaces four minutes later as `-backend-config="bucket="`. An
          # assignment is the form whose failure `set -e` actually sees.
          TF_STATE_BUCKET=$(aws ssm get-parameter \
            --name "/${{ env.PROJECT }}/bootstrap/state_bucket" \
            --query 'Parameter.Value' --output text)
          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_ENV"
          echo "resolved from /${{ env.PROJECT }}/bootstrap/*"
      - name: resolve what foundation published
        # A destroy still has to evaluate the configuration, so every required variable still
        # has to resolve. `terraform validate` never asked for one, which is why this was
        # missing and looked fine.
        run: |
          set -euo pipefail
          resolved=0
          while read -r name value; do
            echo "TF_VAR_${name}=${value}" >> "$GITHUB_ENV"
            resolved=$((resolved + 1))
          done < <(
            aws ssm get-parameters-by-path \
              --path "/${{ env.PROJECT }}/foundation" \
              --query 'Parameters[].[Name,Value]' --output text \
              | sed "s|/${{ env.PROJECT }}/foundation/||"
          )
          # An empty path is not an empty result, it is a missing foundation — and `set -e`
          # cannot see it, because reading nothing is a successful read. Left unchecked this
          # job would carry on, set no variables, and stop at an input prompt with no terminal
          # to appear on: the same failure the required-variable gate was written to close,
          # arriving through a different door.
          if [ "$resolved" -eq 0 ]; then
            echo "::error::nothing published under /${{ env.PROJECT }}/foundation/ — apply the foundation layer first"
            exit 1
          fi
          echo "resolved $resolved reference(s) from /${{ env.PROJECT }}/foundation/*"
      - name: empty the lake before destroying it
        # A versioned bucket with objects in it refuses to be destroyed, and a teardown that
        # fails on that leaves the bucket, its storage cost and the KMS key it needs. The
        # deletion is explicit rather than `force_destroy = true` on the resource, because
        # `force_destroy` is a property somebody can trip over during a *normal* apply.
        #
        # The bucket name comes from the layer's own state, not from a repository variable.
        # A transcribed name here is the worst of the four this workflow used to carry: a
        # `destroy` pointed at a bucket that does not exist reports success, empties nothing,
        # and then fails on a bucket that still has objects in it — or, worse, empties a
        # bucket that does exist and belongs to something else.
        run: |
          set -euo pipefail
          terraform -chdir=infra/lakehouse init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=${{ env.AWS_REGION }}"
          LAKE_BUCKET=$(terraform -chdir=infra/lakehouse output -raw lake_bucket)
          echo "emptying $LAKE_BUCKET"
          aws s3 rm "s3://$LAKE_BUCKET" --recursive || true
      - run: |
          terraform -chdir=infra/lakehouse destroy -auto-approve -refresh=false -var 'expires_at=1970-01-01'

  extraction:
    name: "destroy · extraction"
    needs: lakehouse
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    environment: destroy
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: resolve what bootstrap published
        # Same reason as the deploy: a transcribed value looks like an independent setting, and
        # a destroy pointed at the wrong state bucket is a destroy that reports success having
        # torn down nothing.
        run: |
          set -euo pipefail
          # Assigned to a variable first, deliberately. `echo "X=$(aws ...)"` succeeds when the
          # `aws` call fails — the echo is the command `set -e` judges — and writes an empty
          # value, which surfaces four minutes later as `-backend-config="bucket="`. An
          # assignment is the form whose failure `set -e` actually sees.
          TF_STATE_BUCKET=$(aws ssm get-parameter \
            --name "/${{ env.PROJECT }}/bootstrap/state_bucket" \
            --query 'Parameter.Value' --output text)
          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_ENV"
          echo "resolved from /${{ env.PROJECT }}/bootstrap/*"
      - name: release deletion protection on the record tables
        # The decision table and the ledger carry `deletion_protection_enabled`, which is right
        # for every day except this one. Released explicitly here so that the protection is a
        # real obstacle during normal operation rather than a flag somebody left off.
        run: |
          for table in "${PROJECT}-review-decisions" "${PROJECT}-reprocessing-ledger"; do
            aws dynamodb update-table --table-name "$table" --no-deletion-protection-enabled || true
          done
      - run: |
          terraform -chdir=infra/extraction init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=${{ env.AWS_REGION }}"
          terraform -chdir=infra/extraction destroy -auto-approve -refresh=false

  foundation:
    name: "destroy · foundation"
    needs: extraction
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    environment: destroy
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: resolve what bootstrap published
        # Same reason as the deploy: a transcribed value looks like an independent setting, and
        # a destroy pointed at the wrong state bucket is a destroy that reports success having
        # torn down nothing.
        run: |
          set -euo pipefail
          # Assigned to a variable first, deliberately. `echo "X=$(aws ...)"` succeeds when the
          # `aws` call fails — the echo is the command `set -e` judges — and writes an empty
          # value, which surfaces four minutes later as `-backend-config="bucket="`. An
          # assignment is the form whose failure `set -e` actually sees.
          TF_STATE_BUCKET=$(aws ssm get-parameter \
            --name "/${{ env.PROJECT }}/bootstrap/state_bucket" \
            --query 'Parameter.Value' --output text)
          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_ENV"
          echo "resolved from /${{ env.PROJECT }}/bootstrap/*"
      - name: resolve the alert address
        # A SecureString, so `--with-decryption`. Needed even here: the SNS subscription is
        # part of the configuration, and a destroy evaluates the configuration.
        run: |
          set -euo pipefail
          BUDGET_EMAIL=$(aws ssm get-parameter \
            --name "/${{ env.PROJECT }}/bootstrap/budget_notification_email" \
            --with-decryption --query 'Parameter.Value' --output text)
          echo "BUDGET_EMAIL=$BUDGET_EMAIL" >> "$GITHUB_ENV"
      - name: empty the data zones
        run: |
          for zone in landing records evidence access-logs; do
            aws s3 rm "s3://${PROJECT}-${zone}-$(aws sts get-caller-identity --query Account --output text)" --recursive || true
          done
      - run: |
          terraform -chdir=infra/foundation init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=${{ env.AWS_REGION }}"
          terraform -chdir=infra/foundation destroy -auto-approve -refresh=false \
            -var 'expires_at=1970-01-01' \
            -var "budget_notification_email=$BUDGET_EMAIL"

  # `infra/bootstrap` is deliberately absent. It holds the state bucket, which has
  # `prevent_destroy`, and the role this workflow assumes to do any of the above — a teardown
  # that destroyed its own credentials halfway through would leave the rest standing and
  # unreachable. Removing the backend is a deliberate, manual, last act.

  report:
    name: what is left
    needs: foundation
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    environment: destroy
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: resolve what bootstrap published
        # Same reason as the deploy: a transcribed value looks like an independent setting, and
        # a destroy pointed at the wrong state bucket is a destroy that reports success having
        # torn down nothing.
        run: |
          set -euo pipefail
          # Assigned to a variable first, deliberately. `echo "X=$(aws ...)"` succeeds when the
          # `aws` call fails — the echo is the command `set -e` judges — and writes an empty
          # value, which surfaces four minutes later as `-backend-config="bucket="`. An
          # assignment is the form whose failure `set -e` actually sees.
          TF_STATE_BUCKET=$(aws ssm get-parameter \
            --name "/${{ env.PROJECT }}/bootstrap/state_bucket" \
            --query 'Parameter.Value' --output text)
          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_ENV"
          echo "resolved from /${{ env.PROJECT }}/bootstrap/*"
      - name: list anything still tagged for this project
        # The step that makes this a teardown rather than a hope. A destroy that reports success
        # while leaving a tagged resource behind is the exact failure this file exists to
        # prevent, and the only way to know is to ask afterwards.
        run: |
          aws resourcegroupstaggingapi get-resources \
            --tag-filters "Key=manifest:project,Values=${PROJECT}" \
            --query 'ResourceTagMappingList[].ResourceARN' --output table
          echo "Anything listed above still exists and still costs money."
