# The teardown path. **Not optional, and exercised — first run 2026-08-10, after the first
# deploy.** It is the half of the pair that gets written and never tested, so the test is worth
# more than the writing: what it left standing is a defect in this file, not an accident.
#
# A repository with a deploy path and no destroy path is how an estate gets left standing, and
# it is the difference between a portfolio piece and a bill. This file exists from the same
# commit as `deploy.yml` for that reason, and it is written to work on the day it is needed —
# which is a day when something has gone wrong and nobody wants to be reading Terraform.
#
# **Reverse dependency order, and it matters.** Foundation holds the KMS keys and the VPC every
# other layer's resources are encrypted with and attached to; destroying it first leaves
# orphaned resources that cannot be deleted because the key that encrypts them is scheduled for
# deletion. So the order here is the deploy order backwards, and each layer runs even if the
# one before it failed — `if: always()` — because a teardown that stops at the first error
# leaves exactly the expensive half standing.
#
# **The state bucket is not destroyed.** `infra/bootstrap` has `prevent_destroy` on it and this
# workflow does not touch that layer. Losing state does not lose the configuration; it loses the
# *mapping* to what exists, and an apply against a lost mapping creates a second estate beside
# the first.

name: destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the project name to confirm. This deletes data.'
        required: true
        type: string
      include_expensive:
        description: "Also destroy batch and analytics (they are separate dispatches on the way up)."
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: destroy
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.5"
  AWS_REGION: eu-central-1
  PROJECT: manifest

jobs:
  confirm:
    name: confirm the intent
    runs-on: ubuntu-latest
    steps:
      - name: refuse anything but the project name
        if: inputs.confirm != 'manifest'
        run: |
          echo "This workflow destroys infrastructure and the data in it."
          echo "Type the project name to proceed."
          exit 1

  analytics:
    name: "destroy · analytics"
    needs: confirm
    if: inputs.include_expensive
    runs-on: ubuntu-latest
    environment: destroy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: resolve what bootstrap published
        # Same reason as the deploy: a transcribed value looks like an independent setting, and
        # a destroy pointed at the wrong state bucket is a destroy that reports success having
        # torn down nothing.
        run: |
          set -euo pipefail
          # Assigned to a variable first, deliberately. `echo "X=$(aws ...)"` succeeds when the
          # `aws` call fails — the echo is the command `set -e` judges — and writes an empty
          # value, which surfaces four minutes later as `-backend-config="bucket="`. An
          # assignment is the form whose failure `set -e` actually sees.
          TF_STATE_BUCKET=$(aws ssm get-parameter \
            --name "/${{ env.PROJECT }}/bootstrap/state_bucket" \
            --query 'Parameter.Value' --output text)
          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_ENV"
          echo "resolved from /${{ env.PROJECT }}/bootstrap/*"
      - name: resolve what foundation published
        # **One resolver, and it stands in rather than refusing.**
        #
        # Foundation runs last and takes its own SSM parameters with it, so after a
        # teardown that failed part-way — the only kind anybody re-runs — every layer
        # above it used to stop here, before Terraform started. The estate then sat in
        # the one state where the workflow written to remove it refused to run.
        #
        # A destroy is removing these resources, so the values only have to satisfy
        # variable validation; nothing reads them. Same reasoning already written for
        # `reader_image_digest`, which is all zeros so it satisfies the format and
        # could never name a real image. Placeholders are announced, loudly.
        run: |
          set -euo pipefail
          # `--upgrade`, because the runner ships a boto3 old enough not to know
          # `bedrock-data-automation` exists at all: *"Unknown service"*, with a list of two
          # hundred valid names that does not include it. Installing without it is a no-op
          # against the preinstalled version, which is the shape that looks like a dependency
          # being handled.
          python3 -m pip install --quiet --upgrade boto3
          python3 scripts/destroy_references.py \
            --project "${{ env.PROJECT }}" --layer foundation \
            --region "${{ env.AWS_REGION }}" --account "${{ vars.AWS_ACCOUNT_ID }}"
      - name: resolve what lakehouse published
        # **One resolver, and it stands in rather than refusing.**
        #
        # Foundation runs last and takes its own SSM parameters with it, so after a
        # teardown that failed part-way — the only kind anybody re-runs — every layer
        # above it used to stop here, before Terraform started. The estate then sat in
        # the one state where the workflow written to remove it refused to run.
        #
        # A destroy is removing these resources, so the values only have to satisfy
        # variable validation; nothing reads them. Same reasoning already written for
        # `reader_image_digest`, which is all zeros so it satisfies the format and
        # could never name a real image. Placeholders are announced, loudly.
        run: |
          set -euo pipefail
          # `--upgrade`, because the runner ships a boto3 old enough not to know
          # `bedrock-data-automation` exists at all: *"Unknown service"*, with a list of two
          # hundred valid names that does not include it. Installing without it is a no-op
          # against the preinstalled version, which is the shape that looks like a dependency
          # being handled.
          python3 -m pip install --quiet --upgrade boto3
          python3 scripts/destroy_references.py \
            --project "${{ env.PROJECT }}" --layer lakehouse \
            --region "${{ env.AWS_REGION }}" --account "${{ vars.AWS_ACCOUNT_ID }}"
      - run: |
          terraform -chdir=infra/analytics init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=${{ env.AWS_REGION }}"
          terraform -chdir=infra/analytics destroy -auto-approve -refresh=false -var 'expires_at=1970-01-01'
      - name: remove the log groups Redshift made for itself
        # **`log_exports` is a namespace setting and the log groups are the service's, not
        # Terraform's.** Nothing in `infra/analytics` declares them, so `terraform destroy` takes
        # the namespace and leaves `/aws/redshift/manifest-marts/connectionlog` and its two
        # siblings behind — with no retention, holding whatever was logged, for ever.
        #
        # `estate_sweep.py` found them by name, which is the sweep that exists for exactly this:
        # a resource created outside Terraform is the resource nobody tagged. The tag sweep was
        # clean and these were still there.
        run: |
          set -euo pipefail
          for group in $(aws logs describe-log-groups \
              --log-group-name-prefix "/aws/redshift/${{ env.PROJECT }}-" \
              --query 'logGroups[].logGroupName' --output text); do
            aws logs delete-log-group --log-group-name "$group" && echo "deleted $group"
          done
          echo "no Redshift log group for ${{ env.PROJECT }} remains"

  batch:
    name: "destroy · batch"
    needs: confirm
    if: inputs.include_expensive
    runs-on: ubuntu-latest
    environment: destroy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: resolve what bootstrap published
        # Same reason as the deploy: a transcribed value looks like an independent setting, and
        # a destroy pointed at the wrong state bucket is a destroy that reports success having
        # torn down nothing.
        run: |
          set -euo pipefail
