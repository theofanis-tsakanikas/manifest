# Which reader may read a page, in which language. ADR-0004.
#
# This file exists because of a fact verified on 2026-08-09 and recorded in
# `docs/AWS-CONSTRAINTS.md`: Textract, Bedrock Data Automation and Comprehend all document the
# same six input languages — English, German, Spanish, French, Italian, Portuguese. Two of the
# three document languages in this scenario, Greek and Dutch, are outside all of them.
#
# Sending a Greek page to a service that does not read Greek does not fail loudly. It returns a
# confident-looking result over a language the model never saw, and that score then enters a
# threshold derived on the assumption that it means something. Failing to route is a bug;
# routing to an ineligible reader is a fabricated result.
#
# So eligibility is declared per language, here, as data — and tier 0 is on every line, because
# it is the only reader that actually runs in this repository.
version: 1

tiers:
  0: >-
    The local reference reader. Runs on the machine, over the real corpus, producing the
    genuine confidences and genuine geometry claims 1 and 2 are derived from. Every language
    it has data for. Zero marginal cost.
  1: >-
    Managed per-page OCR. Better on degraded print, tables and forms. Six documented input
    languages. **Reports a confidence per word**, so a page it reads can publish on its score —
    and unlike tier 2, that score now has thresholds derived from a recording of this reader
    against the labelled set, which is what the permission to publish actually rests on.
    **Called for the first time on 2026-08-15**: 2,336 eligible pages, 127,142 words, recorded
    to `recordings/textract/` with the reader version and a corpus fingerprint. This line read
    "not yet called" until then. Of its 35 fields, 3 derived a usable threshold and 32 are
    always-review; 4 more derived 0.000 and were floored to always-review by
    `minimum_useful_threshold` below, because a threshold of zero separates nothing — it says
    the reader was never caught being wrong, which is a small sample rather than a safe field.
    The comparison against tier 0 is made on the pages **both** readers saw: this reader has no
    Greek or Dutch, and comparing its English-only set against tier 0's whole corpus would
    measure the language mix and report it as reader quality.
  2: >-
    Managed document automation, per page. Best on reading order and table structure, and it
    measures its own raster. **It reports a per-word confidence, and this project does not
    publish on it** — which is a different sentence from the one that was here, and the
    difference is the point. This line read "reports no confidence anywhere, verified against
    the published standard-output schema, 2026-08-10". The first real call, on 2026-08-13,
    returned a confidence on every word, varying from 0.729 to 1.0. The published schema and the
    running service disagreed, and the schema is what had been checked. A page routed here still
    cannot publish on a score — not because there is no number, but because **no threshold here
    is derived from that number**: claim 1's thresholds come from a committed recording of the
    tier-0 engine against a labelled set, and there is no such recording for this tier. Doctrine
    rule 3, applied to a number that exists rather than to one that does not. Its line-level
    confidence, incidentally, is about 0.01 on every line of a page whose words score above 0.99,
    so whatever that field measures it is not the probability that the line is right.
  3: >-
    A multilingual model with document input, per token. The only escalation path for Greek and
    Dutch. **Reports no confidence either**, and any it is asked for is refused at the adapter:
    a self-reported score is a token the prompt made likely, not a measured frequency. Its
    provenance comes from the tier-0 reading's geometry, so it can choose correctly among what
    tier 0 saw and cannot rescue what tier 0 missed. Written as an adapter, schema-tested, not
    yet called.

# What the tier list above means for the queue, stated here because it is the expensive part.
#
# Only tier 0 and tier 1 report a confidence. Escalating past tier 1 is therefore a decision to
# spend a human: the page gets a better reading and no score to publish it on, so it arrives in
# the queue with `Reason.UNSCORED`. That is not a defect in the routing — it is what these
# services are — and it is written down here so that the review capacity model in
# `contracts/review/` is costed against the truth rather than against an assumption that an
# expensive tier returns something a threshold can compare.

# **Which tiers may publish on their own score, as data rather than as a sentence.**
#
# This was prose, and a test grepped the prose for "no confidence" to check that the handler's
# `SCORING_TIERS` agreed with it. Then tier 2's description was corrected — the service *does*
# report a per-word confidence — and the correction *quotes the old sentence*, so the grep still
# matched and the test still passed. It was checking that a phrase appeared somewhere in a
# paragraph, which a paragraph about that phrase satisfies.
#
# So the fact is a field. `false` here does not mean "returns no number": tiers 2 and 3 both
# return something. It means **no threshold in this repository is derived from that number** —
# claim 1's thresholds come from a committed recording against a labelled set, and there is no
# such recording for either tier. A tier flipped to `true` without one would be publishing on a
# score nothing measured, which is the fabricated result this whole project argues against.
publishes_on_its_own_score:
  0: true
  1: true
  2: false
  3: false

# **A derived threshold of zero is not a threshold, and may not ship.**
#
# Recording Textract over the labelled corpus produced four fields whose derivation came out at
# exactly 0.000 — `gross_weight`, `package_count`, `terminal`, `vessel_name`. The arithmetic is
# right: the reader made no error at all on those fields in that population, so publishing at any
# score fits the budget.
#
# It is also the least useful number the derivation can produce. A threshold exists to separate
# the readings that may publish from the ones that may not, and a threshold of zero separates
# nothing: it says the confidence carried no information because the reader never had to be
# wrong. That is evidence of a clean sample, not of a working confidence signal — and shipping it
# would put values into a customs record on a score that has never been shown to mean anything.
#
# So a derivation at or below this floor ships as **always-review** instead, with its N on the
# report either way. The fix is more labelled data, not a lower floor: a field that genuinely
# publishes at 0.02 will say so once the population contains an error to learn from.
#
# Declared as data rather than written into the renderer, because it is a policy about what
# counts as evidence and those live in contracts.
minimum_useful_threshold: 0.02

languages:
  - language: en
    eligible_tiers: [0, 1, 2, 3]

  # Greek: the language of the Piraeus office, and outside every managed *reader* in the stack.
  # Tiers 1 and 2 are absent from this line on purpose and it is the single most consequential
  # absence in the contract set — both document services publish the same six input languages,
  # and Greek is in neither. The model tier is the only escalation there is.
  - language: el
    eligible_tiers: [0, 3]

  # Dutch: the language of the Rotterdam office, and in the same position as Greek.
  - language: nl
    eligible_tiers: [0, 3]

  - language: de
    eligible_tiers: [0, 1, 2, 3]

  - language: fr
    eligible_tiers: [0, 1, 2, 3]

  - language: es
    eligible_tiers: [0, 1, 2, 3]

  - language: it
    eligible_tiers: [0, 1, 2, 3]

  - language: pt
    eligible_tiers: [0, 1, 2, 3]

  # Chinese and Arabic appear as party names rather than as page text. Neither managed document
  # reader lists them as an input language, and neither supports vertical text at all, so a
  # page in either escalates only to the model tier — and the entity work that actually needs
  # them reads a name, not a page.
  - language: zh
    eligible_tiers: [0, 3]

  - language: ar
    eligible_tiers: [0, 3]
