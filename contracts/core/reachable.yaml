# Core modules that reach the running estate by a route no import graph can see.
#
# `scripts/check_the_map_matches_the_ground.py` walks imports from `handlers/`, `gates/` and
# `pipelines/` and reports any module in `core/` it cannot get to. That catches the real defect —
# a decision this repository proved and never asked — and it has one blind spot: a module whose
# output travels to the estate as *data* rather than as a call.
#
# So the route is declared, and the rule for an entry here is that somebody can **go and check
# it**. "It is used" is not a route. A named producer, a named artefact and a named consumer is.
#
# Doctrine rule 6: exceptions expire. An entry that stops being true goes red on its date rather
# than living for ever because nobody re-read it.
version: 1

reaches_the_estate:
  calibration: >-
    `scripts/thresholds_artefact.py` runs it over `recordings/ocr/` during the deploy and writes
    `thresholds/<reader>.json` to the records bucket; `handlers/publish.py` reads that artefact
    and looks each field's threshold up by the reader's exact identity. The estate never derives
    a threshold at request time — that is the whole of decision 20 — so an import from a handler
    would be the defect rather than the fix.

  injection: >-
    **Nothing calls it, and that is the entry.** `CLAUDE.md` and `SECURITY.md` both point a
    reader at `security/injection.py` as the control on untrusted document text, and no path in
    the running estate reaches it: `handlers/escalate.py` sends the page to the model as an
    *image*, under a prompt it composes itself. That is a genuine structural fence — a document
    cannot become an instruction if the instruction never enters the prompt as text — and it is
    a different fence from this module's.

    So the route is not "it is used". It is: **there is no text-to-prompt path in this system
    today**, `envelope()` is the fence for the one that does not exist yet, and `evals/injection`
    is what proves the fence works — 0 false positives across 2,969 documents, and every planted
    string recognised.

    What this entry buys is the thing a comment cannot: on the day somebody adds a text-based
    extractor, this declaration is the file that has to change, and changing it is where the
    question *"does that path go through `envelope()`?"* gets asked. Without it, the module goes
    on being cited by two documents and called by none.

  artefact: >-
    `scripts/train_classifier.py` imports it during the deploy — `deploy.yml`, *"fit and upload
    the classification artefact"* — and writes the fitted pipeline into `model.tar.gz` in the
    records bucket. The estate never fits a model at request time, so an import from a handler
    would be the defect rather than the fix. Same shape as `calibration` above: a producer, a
    named artefact, a consumer.

  inference: >-
    **Packaged as `code/inference.py` inside `model.tar.gz` and run by SageMaker's own serving
    container.** No Python in this repository imports it and none should: it is the entry point
    of a different process, in a different image, started by a service. The route is checkable —
    `scripts/train_classifier.py` puts it there and `handlers/classify.py` calls the endpoint
    that runs it — which is the standard this file sets, and it is why the entry is a route
    rather than the words "it is used".

  grounding: >-
    **Nothing calls it, and the entry says so.** `evals/grounding` proves it and
    `handlers/classify.py` does not reach it: the estate's classification path applies the
    abstention band from `classification/hs.py`, and the grounding check — that a proposal must
    point at the nomenclature text it came from — is scored offline and not yet enforced in the
    running system.

    That is claim 2's rule applied to text, and it is the same state `security/injection.py` is
    in. Declared for the same reason: on the day the estate enforces grounding, this entry is
    what has to change, and changing it is where somebody asks whether the path really goes
    through `check()`.

accepted_by: "Theofanis Tsakanikas"
accepted_on: "2026-08-14"   # `injection` and the three `classification` entries added 2026-08-19
expires_on: "2027-02-14"

ends_when: >-
  For `injection`: a text-based extraction path exists and is asserted to pass through
  `envelope()` before reaching a prompt — at which point the module has a caller and needs no
  declaration. Until then the honest statement is that the fence guards a door not yet built.

  For `calibration`: the artefact route is checked by something narrower than this file — a test that renders the
  artefact and asserts the handler resolves a threshold from it, which is a stronger statement
  than "there is a route" and would make this entry unnecessary.
