# Which warehouse columns have a source, which are derivable, and which nothing produces.
#
# **The finding this file recorded, and what changed on 2026-08-13.** `infra/lakehouse` and
# `infra/analytics` both applied cleanly on 2026-08-11 and neither had ever held a row: nothing
# in this repository wrote the Iceberg table, and nothing carried it into Redshift.
#
# Both halves are now built. `handlers/land.py` writes one row per field per version — and it
# refuses to write a version twice, which took finding the lake holding three copies of one
# document — and `scripts/load_warehouse.py` projects the current version of each document into
# `gold`. So the categories below have stopped being hypothetical: `derivable` is a list of
# mappings a loader performs, and `unsourced` is a list of columns it deliberately leaves NULL.
#
# Two entries left `unsourced` with it. `document_type` and `language` were listed as *known at
# extraction and absent from the lake table*, "listed here rather than fixed because adding a
# column to a table nothing writes fixes nothing" — a correct reason that expired the moment
# something wrote it. They are columns of the lake now.
#
# `scripts/check_marts.py` proves the marts read only columns `analytics/schema.sql` declares.
# That is true, useful, and says nothing about whether any of them has a source.
# `scripts/check_warehouse_is_fed.py` asks the next question, and this file is the answer to it.
#
# **Why an acceptance and not a fix.** Two of the three categories below are fixable and one is
# not. A loader can rename `field` to `field_name`; it can derive `reader_tier` from the reader
# identity. It cannot produce a carrier or a client id, because those are facts about a
# commercial relationship that a document-extraction pipeline never sees — they live in a
# customer system this project does not have and is not pretending to have.
#
# Filling them anyway is doctrine rule 3 with a warehouse attached: a mart that reads an
# invented column returns a number with the shape of an answer.
# **What changed on 2026-08-14.** `handlers/decide.py` gave the estate a way to record a human
# decision, and `scripts/load_warehouse.py` began joining it into `gold.review_item`. Ten columns
# were still listed below as facts nothing produces — five of the human loop's, three the loader
# derives from the lake, two modelled costs — and every check passed, because each of them read
# this file and the schema and none of them read the loader. `check_warehouse_is_fed.py` now
# parses the loader and refuses that disagreement in both directions.
version: 1

# Renames and computations a loader may perform, with the lake column each comes from. Written
# down so that "derivable" is a claim somebody made rather than an assumption a loader made
# silently — and so the next person can check the arithmetic.
derivable:
  document_version: "the lake's `version`"
  field_name: "the lake's `field`"
  field_value: "the lake's `value`"
  reader_identity: "the lake's `reader`"
  reader_tier: "the tier the lake's `reader` identity belongs to, per contracts/cascade/routing.yaml"
  always_review: "`threshold IS NULL` — the derivation's own way of saying it"
  published: "`provenance_verified AND confidence >= threshold`, the pipeline's own rule"
  read_on: "the lake's `extracted_on`, truncated to a date"
  found_on: "the lake's `extracted_on`, truncated to a date"
  outcome: "the lake's `review_decision`"
  item_id: "the lake's `version` and `field`, joined — the item is the field at that version"
  queued_reason: >-
    `threshold IS NULL` tells always-review apart from below-threshold, which is the distinction
    the column exists to make. Derived from the lake's `threshold` and `published`.
  queued_on: "the lake's `extracted_on` — when the field was read and therefore queued"
  modelled_cost: >-
    The lake's `reader` identity gives the tier; the tier gives a published unit price. A model,
    and the column is named `modelled_cost` because `docs/DECISIONS.md` 15 requires the label to
    travel with the figure rather than sit in a footnote.
  declared_value: >-
    The lake's `value` on the declaration's `declared_value` field, read as a number. `81,832.10`
    and `81.832,10` are the same amount in two conventions and both appear in this corpus; a
    value the loader cannot read confidently drops the whole line rather than guessing, because
    the shape of that error is eighty-one euros in a duty column and nobody notices it.
  declared_on: >-
    The lake's `value` on the declaration's `declaration_date` field — the declaration's own
    date, not the date this system read it. The loader wrote `extraction_date` here first and
    `scripts/check_warehouse_is_fed.py` refused it against this very entry: a duty exposure
    grouped by when a broker happened to scan the paperwork is a different question.
  country_of_origin: >-
    The lake's `value` on the declaration's `country_of_origin` field, truncated to the two-letter
    code the column declares.
  currency: >-
    The lake's `value` on the declaration's `currency` field. The page prints it beside a symbol
    — `$ USD` — so the loader takes the last three characters rather than the whole string.
  hs_code: >-
    The lake's `value` on the customs declaration's `hs_code` field. Extracted from the page like
    any other field and declared always-review by its own contract — the classifier's output is a
    *proposal* and is deliberately not loaded anywhere, because a proposal is a ranking and a
    declaration is a commitment.
  duty_amount: >-
    The lake's `value` on the declaration's `duty_amount` field, when the page prints one. NULL
    when it does not: a zero here is a duty figure somebody would read.
  modelled_currency: >-
    The currency the modelled price is published in, alongside the `reader`-derived tier that
    selected it. Never "as above": this file's own guard refuses a derivability claim that names
    no lake column, and it refused this one.

# Columns nothing in the lake carries and something in this repository nevertheless writes. The
# third category, added on 2026-08-14 because the first two could not describe the truth: the
# lake is not the only thing this estate records. The human loop's record lives in DynamoDB, and
# `scripts/check_warehouse_is_fed.py` requires every entry here to name a file that exists.
sourced_elsewhere:
  reviewer: >-
    Recorded per decision by `src/manifest/handlers/decide.py` in the decisions table, and read
    back by `scripts/load_warehouse.py`. **The personal-data question is named, not answered**:
    this is an internal operator identifier rather than a data subject on a document, and
    `review_queue_economics` groups by it because doctrine rule 2 is about *a reviewer* whose
    agreement rate is 100% — an aggregate over everybody cannot see one. What is owed is a
    retention class for it in `docs/REGULATORY.md`, and it is owed rather than paid.
  decision: >-
    Approved, corrected, supplied or rejected, from `src/manifest/handlers/decide.py`. Written
    whatever it decided: a table holding only approvals makes every agreement rate 100% by
    construction.
  seconds_on_task: >-
    Measured per decision by `src/manifest/handlers/decide.py`. The number doctrine rule 2 turns
    on — a reviewer who spends four seconds on a field is not a control.
  agreed_with_model: >-
    Computed in `src/manifest/handlers/decide.py` from the decision and never accepted from the
    caller, and carried through the loader rather than recomputed. Loaded as a tri-state: NULL
    where nobody decided, which is a different fact from a reviewer who disagreed.
  decided_on: "When the decision was recorded, by `src/manifest/handlers/decide.py`."
  human_decided: >-
    **The join is the control.** `scripts/load_warehouse.py` emits a declaration line only for a
    version whose `hs_code` carries a row in the decisions table written by
    `src/manifest/handlers/decide.py`, so the column is `TRUE` on every row by construction
    rather than by assertion — and a declaration nobody decided produces no row at all. This
    entry previously warned that it was the column most likely to be quietly defaulted to `true`
    by a loader in a hurry, and the defence is that there is no code path that can write `FALSE`
    because there is no code path that emits an undecided line.

# Columns nothing in this system produces, and the reason each one is absent. A mart that reads
# one of these returns a shape rather than an answer until something that knows the fact is
# connected — which is a decision about scope, not a bug to be fixed in a loader.
unsourced:
  shipment_id: >-
    Documents arrive as files; the shipment they belong to is a fact a broker's operational
    system holds. The corpus encodes it in a filename because the corpus generated both.
  source_channel: >-
    How the document arrived — email, portal, EDI. The landing zone sees an object, not a
    channel.
  carrier: >-
    A commercial fact about the shipment. Appears on a bill of lading as text this system may
    extract, and mapping that text to a carrier identity is entity resolution against a
    customer's master data, which this project does not have.
  client_id: >-
    As above, and further away: the client is a relationship, not a field on a page.
  left_document: "Reconciliation findings are computed offline and never written to the lake."
  right_document: "As above."
  rule_id: "As above."
  severity: "As above."

# ── The rows that predate the schema ─────────────────────────────────────────
#
# The lake gained `document_type`, `language`, `reader_tier` and `published` on 2026-08-13.
# Every row written before that carries NULL for them, and `scripts/load_warehouse.py` excludes
# them from every load and prints how many.
#
# **They are left as they are, deliberately.** Three reasons, and the third is the one that
# decides it:
#
#   - They are the lake's own history, and the lake is the record. Doctrine rule 4 says a
#     correction never erases what was previously published; a backfill that invented a
#     `document_type` for a row that never carried one would be writing history rather than
#     keeping it.
#   - The value is derivable from the records bucket, which still holds every version — so
#     nothing is lost, and the backfill can be done on the day somebody needs those rows.
#   - Nobody needs them. They are readings of documents this repository generated, from before
#     the columns existed, in a corpus that regenerates from a seed. Spending a schema migration
#     on them would be work performed to make a number look tidier.
#
# What is *not* given up: the loader says how many it excluded, every time. A load that quietly
# dropped rows would be the silent-truncation failure this whole file exists to prevent.
pre_schema_rows: "left in the lake, excluded from every load, and counted out loud"

accepted_by: "Theofanis Tsakanikas"
accepted_on: "2026-08-11"
# Shorter than the others on purpose: this one blocks a claim rather than weakening a control,
# and a claim that stays blocked for a quarter is a claim to remove instead.
expires_on: "2026-10-11"

ends_when: >-
  Either a loader writes the lake and the derivable columns are computed there — at which point
  only the genuinely external facts remain and this file shrinks to them — or `docs/DECISIONS.md`
  6 is applied as written: *if these marts are not built, drop Redshift rather than keeping it as
  a CV keyword*.
