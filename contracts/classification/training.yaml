# Goods descriptions, by tariff heading, for fitting the classifier.
#
# **Curated, not generated, and the difference is the whole point.** A generator that produced
# descriptions from each heading's own text would teach the classifier the generator's template,
# and the accuracy figure would measure whether a template is recoverable — which it always is.
# These are written the way a broker writes a line on an invoice: abbreviations, trade terms,
# a dimension or a grade where one would appear, and the distinguishing word present or absent
# as it really is.
#
# **This is not the document corpus and must not become it.** `corpus/world.py` draws from eight
# fixed goods when it renders pages, and every threshold in this repository derives from a
# recording of those pages. Fitting a model on *this* file changes no reading, no recording and
# no threshold — which is why the training set lives here rather than in the generator. A
# classifier trained on the corpus would be trained on eight strings mapped one-to-one onto eight
# codes: a lookup table that scores 100% and means nothing.
#
# **Where the accuracy figure may appear.** Nowhere on the scoreboard, and never as "the
# classifier is N% accurate". It is a statement about a distribution this repository wrote, over
# twelve headings chosen because the corpus falls under them, against a tariff with five
# thousand. `docs/DECISIONS.md` and `PLAN.md` both say so and this file does not weaken it.
#
# **The `ambiguous` block is the reason this exists at all.** Three of the six pairs below differ
# by one word — glazed against unglazed, virgin against not, printed against not — and a
# description that omits it is a description no competent professional would resolve. A model
# fitted only on clear examples will pick one anyway and be *most* confident where the trade is
# least certain. These lines are labelled with the pair rather than a heading, and the harness
# requires them to land inside the abstention band that `headings.yaml` declares.
version: 1

provenance: >-
  Written by hand for this repository on 2026-08-13. Not sampled from real customs declarations,
  not scraped, and not produced from the heading descriptions themselves. Any figure derived
  from it is a statement about this file.

