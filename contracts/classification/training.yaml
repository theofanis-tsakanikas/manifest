# Descriptions that name the goods and omit the one word that decides the heading. Labelled with
# the pair they fall between, because that is the honest label: not "unknown", but "these two,
# and nothing here separates them".
#
# **These lines tested this file before they tested any model, and this file failed first.** The
# first fit separated `Ceramic wall tiles, assorted colours` by 0.15 and `Olive oil in 5L tins` by
# 0.10, against a band of 0.08 — not because the model was wrong but because *wall* and *5L tins*
# had been written, by hand and without noticing, into only one side of each pair. The model
# learned the vocabulary of the person who typed the training set. The fix was to spread those
# incidental terms across both headings, never to widen the band: a leak like this is exactly the
# defect that makes a real classifier confident about the packaging rather than the goods.
#
# **And therefore what this block is, and is not.** It was iterated against three times: fit,
# read which pairs separated, find the leaked term, spread it. The band never moved — it is 0.08
# in `headings.yaml` and was 0.08 at every step, which is the one thing that would have made the
# exercise dishonest. But a test a file was edited until it passed is a *constraint the file
# satisfies*, not evidence that a model fitted on it abstains on contested descriptions it has
# never influenced. It is the same distinction claim 4 draws about its own planted mismatches,
# and it is drawn here for the same reason. A description added to this block from now on tests
# the model; these seven tested the curation, and found it wanting twice.
