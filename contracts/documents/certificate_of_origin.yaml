# The document with a stamp on it. `docs/SCENARIO.md`: the chamber's stamp lands on the country
# field roughly 8% of the time, which is the corpus pathology that produces genuine
# low-confidence reads on a field with a real duty consequence.
id: certificate_of_origin
title: Certificate of origin
description: >-
  Issued by a chamber of commerce. States the country of origin of the goods, and carries the
  chamber's stamp and a signature. The stamp lands over the country field often enough that
  this document is where abstention has to work rather than be described.
version: 1

fields:
  - name: certificate_number
    type: code
    description: The issuing chamber's reference for this certificate.
    error_budget: 0.005
    comparison: [unicode, whitespace, case, separators]

    anchors:
      en: "Certificate no."
      el: "Αρ. πιστοποιητικού"
      nl: "Certificaatnr."
  - name: country_of_origin
    type: country
    description: >-
      ISO 3166-1 alpha-2 country of origin. Decides preferential duty rates, so a wrong value
      is a quantifiable financial and legal exposure — and it is the field the chamber's stamp
      lands on. Two characters, no redundancy, nothing to check it against on this document.
    error_budget: 0.001

    anchors:
      en: "Country of origin"
      el: "Χώρα καταγωγής"
      nl: "Land van oorsprong"
  - name: issuing_chamber
    type: text
    description: >-
      The chamber of commerce that issued the certificate. Extracted for the audit record;
      carries no duty consequence.
    required: false
    error_budget: 0.02
    retention: operational
    comparison: [unicode, whitespace, case]

    anchors:
      en: "Issuing chamber"
      el: "Εκδούσα αρχή"
      nl: "Afgevende instantie"
  - name: issue_date
    type: date
    description: >-
      The date of issue. A certificate issued after the goods were shipped is an anomaly worth
      surfacing, so the date is a duty-relevant field rather than an administrative one.
    error_budget: 0.005

    anchors:
      en: "Date"
      el: "Ημερομηνία"
      nl: "Datum"
  - name: consignee
    type: party
    description: >-
      The party the certificate is issued in favour of. May be a natural person.
    required: false
    error_budget: 0.02
    comparison: [unicode, whitespace, case]
    personal_data:
      purpose: >-
        Identifying the parties to a shipment is required to lodge a customs declaration and to
        answer a customs authority's question about it afterwards.
      lawful_basis: >-
        Art. 6(1)(c) GDPR — compliance with a legal obligation under Reg. (EU) 952/2013.
    anchors:
      en: "Consignee"
      el: "Παραλήπτης"
      nl: "Geadresseerde"
