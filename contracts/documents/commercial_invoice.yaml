# The seller's document, and the base of the duty calculation. Its line-item table is the one
# that breaks across a page boundary with no repeated header — where naive extraction silently
# loses a row and the total still looks plausible.
id: commercial_invoice
title: Commercial invoice
description: >-
  Issued by the seller. Carries the parties, the line items with unit prices, the currency, the
  incoterm and the total. The total must equal the sum of the lines, which is the one check
  this document can perform on itself — and the one that catches a dropped row.
version: 1

fields:
  - name: invoice_number
    type: code
    description: The seller's own reference for this invoice.
    error_budget: 0.002
    comparison: [unicode, whitespace, case, separators]

    anchors:
      en: "Invoice no."
      el: "Αρ. τιμολογίου"
      nl: "Factuurnr."
  - name: invoice_total
    type: money
    dimension: money
    description: >-
      The stated total. Reconciled against the sum of the line values on this same document and
      against the declared value on the customs declaration. A wrong total is a wrong duty base,
      so this carries one of the two tightest budgets in the set.
    error_budget: 0.002

    anchors:
      en: "Total"
      el: "Σύνολο"
      nl: "Totaal"
  - name: currency
    type: code
    description: >-
      ISO 4217 currency of the invoice. Reader confusion between the euro and the letter E, and
      between the yen and the letter Y, is in the corpus on purpose — a currency read wrong is
      a duty base wrong by whatever the exchange rate happens to be.
    error_budget: 0.001
    # `alphanumeric`, because an invoice prints its currency as `€ EUR` and a declaration as
    # `EUR`. Both name the same currency; the symbol is typography. Claim 4's harness reported
    # every one of those pairs as a disagreement until this was declared, which is the contract
    # layer doing its job — the rule was wrong, and it was wrong in a file rather than in code.
    comparison: [unicode, whitespace, case, alphanumeric]

    anchors:
      en: "Currency"
      el: "Νόμισμα"
      nl: "Valuta"
  - name: incoterm
    type: code
    description: >-
      Incoterms rule, which decides whether freight and insurance are inside the customs value.
      Three letters, and the difference between two of them is money.
    error_budget: 0.002
    comparison: [unicode, whitespace, case]

    anchors:
      en: "Incoterm"
      el: "Όρος παράδοσης"
      nl: "Leveringsconditie"
  - name: seller
    type: party
    description: >-
      The party issuing the invoice. May be a natural person where the seller is a sole trader.
    error_budget: 0.01
    comparison: [unicode, whitespace, case]
    personal_data:
      purpose: >-
        Identifying the parties to a transaction is required to lodge a customs declaration and
        to answer a customs authority's question about it afterwards.
      lawful_basis: >-
        Art. 6(1)(c) GDPR — compliance with a legal obligation under Reg. (EU) 952/2013.

    anchors:
      en: "Seller"
      el: "Πωλητής"
      nl: "Verkoper"
  - name: buyer
    type: party
    description: >-
      The party invoiced. May be a natural person where the buyer is a sole trader.
    error_budget: 0.01
    comparison: [unicode, whitespace, case]
    personal_data:
      purpose: >-
        Identifying the parties to a transaction is required to lodge a customs declaration and
        to answer a customs authority's question about it afterwards.
      lawful_basis: >-
        Art. 6(1)(c) GDPR — compliance with a legal obligation under Reg. (EU) 952/2013.

    anchors:
      en: "Buyer"
      el: "Αγοραστής"
      nl: "Koper"
  - name: line_item_count
    type: quantity
    dimension: count
    unit: pcs
    description: >-
      How many line items the extraction found. Not a field on the document — a count of what
      was read, carried so that a table broken across a page boundary can be caught by the
      total failing to reconcile against a short list rather than by nothing at all.
    error_budget: 0.01

    anchors:
      en: "Qty"
      el: "Ποσότητα"
      nl: "Aantal"
  - name: invoice_date
    type: date
    description: >-
      The date of issue. Decides the exchange rate applied to the customs value where the
      invoice is not in euro, so it is a duty field and not an administrative one.
    error_budget: 0.002

    anchors:
      en: "Date"
      el: "Ημερομηνία"
      nl: "Datum"
  - name: total_net_weight
    type: quantity
    dimension: mass
    unit: kg
    description: >-
      Net weight of the goods invoiced. Reconciled against the packing list; frequently absent,
      which is why it is not required.
    required: false
    error_budget: 0.01
    anchors:
      en: "Net weight"
      el: "Καθαρό βάρος"
      nl: "Nettogewicht"
